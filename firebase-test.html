<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase 연결 테스트 | KIMKO-EDU</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: #f1f5f9; color: #0f172a;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: #64748b; font-size: 14px; margin-bottom: 20px; }
    .card {
      background: #fff; border-radius: 14px; padding: 16px 18px; margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .08);
      display: flex; gap: 14px; align-items: flex-start;
    }
    .icon {
      flex: 0 0 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; background: #e2e8f0;
    }
    .ok   .icon { background: #dcfce7; }
    .fail .icon { background: #fee2e2; }
    .wait .icon { background: #fef9c3; }
    .title { font-weight: 700; margin-bottom: 4px; }
    .msg { font-size: 14px; color: #334155; line-height: 1.5; word-break: break-all; }
    .fail .msg { color: #b91c1c; }
    .live {
      margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap;
    }
    .live input {
      flex: 1 1 200px; padding: 10px 12px; font-size: 15px;
      border: 1px solid #cbd5e1; border-radius: 10px;
    }
    .live button {
      padding: 10px 16px; font-size: 15px; font-weight: 700;
      border: 0; border-radius: 10px; background: #2563eb; color: #fff; cursor: pointer;
    }
    .live button:disabled { background: #94a3b8; cursor: default; }
    .echo {
      margin-top: 10px; padding: 10px 12px; border-radius: 10px;
      background: #eff6ff; color: #1d4ed8; font-weight: 700; min-height: 20px;
    }
    .summary {
      text-align: center; font-size: 18px; font-weight: 800;
      padding: 16px; border-radius: 14px; margin-top: 8px;
    }
    .summary.ok   { background: #dcfce7; color: #166534; }
    .summary.fail { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🔌 Firebase 연결 테스트</h1>
    <div class="sub">페이지를 열면 자동으로 4가지를 검사합니다. 모두 ✅가 나오면 준비 완료입니다.</div>

    <div id="list"></div>

    <div class="card" id="liveCard" style="display:none;">
      <div class="icon">⚡</div>
      <div style="flex:1;">
        <div class="title">실시간 반영 직접 해 보기</div>
        <div class="msg">아무 글자나 쓰고 [보내기]를 누르면, Firebase를 한 바퀴 돌아 아래 파란 칸에 바로 나타나야 합니다.</div>
        <div class="live">
          <input id="liveInput" maxlength="40" placeholder="예: 안녕 파이어베이스!">
          <button id="liveBtn">보내기</button>
        </div>
        <div class="echo" id="liveEcho">(아직 없음)</div>
      </div>
    </div>

    <div id="summary"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js';
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js';
    import {
      getFirestore, doc, setDoc, getDoc, onSnapshot, serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';

    // ---------- 연결 정보 (공개해도 되는 값) ----------
    const firebaseConfig = {
      apiKey: "AIzaSyB94xmL8JSpmTfERsoWPlYy9mDYP5l_fIs",
      authDomain: "kimko-games.firebaseapp.com",
      projectId: "kimko-games",
      storageBucket: "kimko-games.firebasestorage.app",
      messagingSenderId: "579974375902",
      appId: "1:579974375902:web:1794fd7a92044f9bbb154f"
    };

    // ---------- 화면 도구 ----------
    const list = document.getElementById('list');
    function addStep(title) {
      const el = document.createElement('div');
      el.className = 'card wait';
      el.innerHTML = `<div class="icon">⏳</div><div><div class="title"></div><div class="msg">검사 중...</div></div>`;
      el.querySelector('.title').textContent = title;
      list.appendChild(el);
      return {
        ok(msg)   { el.className = 'card ok';   el.querySelector('.icon').textContent = '✅'; el.querySelector('.msg').textContent = msg; },
        fail(msg) { el.className = 'card fail'; el.querySelector('.icon').textContent = '❌'; el.querySelector('.msg').textContent = msg; }
      };
    }
    function explain(err) {
      const code = (err && err.code) || '';
      if (code.includes('unauthorized-domain'))
        return '이 주소가 허용 도메인에 없습니다. Authentication → 설정 → 승인된 도메인에 "kimko-edu.github.io"를 추가하세요.';
      if (code.includes('admin-restricted-operation') || code.includes('operation-not-allowed'))
        return '익명 로그인이 꺼져 있습니다. Authentication → 로그인 방법 → 익명 → 사용 설정을 켜고 저장하세요.';
      if (code.includes('permission-denied'))
        return '보안 규칙에 막혔습니다. Firestore → 규칙 탭에 새 규칙을 붙여넣고 [게시]했는지 확인하세요. (게시 후 1분쯤 걸릴 수 있어요)';
      if (code.includes('unavailable') || code.includes('network'))
        return '인터넷 연결 또는 학교 와이파이에서 Firebase 접속이 막혔을 수 있습니다. 휴대폰 데이터로도 시험해 보세요.';
      if (code.includes('not-found'))
        return 'Firestore 데이터베이스를 찾지 못했습니다. Firestore를 만들었는지 확인하세요.';
      return `알 수 없는 오류: ${code || err}`;
    }
    function finish(allOk) {
      const s = document.getElementById('summary');
      s.className = 'summary ' + (allOk ? 'ok' : 'fail');
      s.textContent = allOk
        ? '🎉 모든 검사 통과! Firebase 준비가 끝났습니다.'
        : '⚠️ 빨간 항목의 안내를 따라 고친 뒤 새로고침하세요.';
    }

    // ---------- 검사 시작 ----------
    let allOk = true;
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 1) 익명 로그인
    const s1 = addStep('1. 익명 로그인 (이름표 받기)');
    let uid;
    try {
      const cred = await signInAnonymously(auth);
      uid = cred.user.uid;
      s1.ok(`이름표를 받았습니다: ${uid.slice(0, 8)}…`);
    } catch (e) {
      s1.fail(explain(e)); finish(false);
      throw e;
    }

    // 2) 내 칸에 쓰고 다시 읽기
    const s2 = addStep('2. 칠판에 쓰고 다시 읽기');
    const myRef = doc(db, 'connectionTest', uid);
    try {
      await setDoc(myRef, { text: '연결 성공', at: serverTimestamp() });
      const snap = await getDoc(myRef);
      if (snap.exists() && snap.data().text === '연결 성공') s2.ok('Firestore(서울)에 저장하고 다시 읽어 왔습니다.');
      else throw { code: 'mismatch' };
    } catch (e) {
      allOk = false; s2.fail(explain(e));
    }

    // 3) 남의 칸은 못 읽어야 정상 (보안 규칙 확인)
    const s3 = addStep('3. 보안 규칙 확인 (남의 칸은 못 읽어야 정상)');
    try {
      await getDoc(doc(db, 'connectionTest', 'someone-else'));
      allOk = false;
      s3.fail('남의 칸이 읽혔습니다! 보안 규칙이 제대로 게시되지 않았습니다. 규칙을 다시 붙여넣고 [게시]하세요.');
    } catch (e) {
      if ((e.code || '').includes('permission-denied')) s3.ok('예상대로 막혔습니다. 보안 규칙이 잘 작동합니다.');
      else { allOk = false; s3.fail(explain(e)); }
    }

    // 4) 실시간 반영
    const s4 = addStep('4. 실시간 반영 (onSnapshot)');
    const liveCard = document.getElementById('liveCard');
    const liveEcho = document.getElementById('liveEcho');
    let gotFirst = false;
    onSnapshot(myRef, (snap) => {
      const d = snap.data() || {};
      liveEcho.textContent = d.live ? `📡 ${d.live}` : '(아직 없음)';
      if (!gotFirst) {
        gotFirst = true;
        s4.ok('실시간 듣기가 연결되었습니다. 아래에서 직접 시험해 보세요.');
        liveCard.style.display = 'flex';
        finish(allOk);
      }
    }, (e) => {
      allOk = false; s4.fail(explain(e)); finish(false);
    });

    const liveInput = document.getElementById('liveInput');
    const liveBtn = document.getElementById('liveBtn');
    async function sendLive() {
      const v = liveInput.value.trim();
      if (!v) return;
      liveBtn.disabled = true;
      try {
        await setDoc(myRef, { live: v, at: serverTimestamp() }, { merge: true });
        liveInput.value = '';
      } catch (e) {
        alert(explain(e));
      }
      liveBtn.disabled = false;
      liveInput.focus();
    }
    liveBtn.addEventListener('click', sendLive);
    liveInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendLive(); });
  </script>
</body>
</html>
