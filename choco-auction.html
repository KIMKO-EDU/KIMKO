<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>무제한 명화 경매</title>
<style>
  /* 레이아웃: 경매장 — 위 진행 바 / 가운데 조명 받은 액자(작품) + 오른쪽 진행 버튼 / 아래 모둠 카드 줄. 프로젝터용 단일 어두운 테마 */
  :root {
    --bg: #1a0f12;
    --wall: #2b1519;
    --panel: #331b20;
    --panel-2: #42242a;
    --line: #5a3138;
    --text: #f7ece4;
    --text-dim: #c4a99f;
    --gold: #e8b64c;
    --gold-light: #f6d98b;
    --win: #f2c14e;
    --void: #b98cf0;
    --lose: #6fb3ff;
    --good: #48d597;
    --bad: #ff6b6b;
    --font-display: 'Gowun Batang', 'Noto Serif KR', serif;
    --font-body: 'Noto Sans KR', system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; background: var(--bg); }
  body {
    margin: 0; color: var(--text); font-family: var(--font-body);
    padding-left: max(1rem, env(safe-area-inset-left, 0));
    padding-right: max(1rem, env(safe-area-inset-right, 0));
    padding-block: 0.75rem 1.25rem;
    background: radial-gradient(ellipse at 40% 0%, #3a1c22 0%, var(--bg) 60%);
  }
  button { font-family: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 0.1875rem solid var(--gold); outline-offset: 0.125rem; }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 93.75rem; margin: 0 auto; display: flex; flex-direction: column; gap: 0.75rem; }

  /* 상단 바 */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .brand { font-family: var(--font-display); font-weight: 700; font-size: 1.625rem; color: var(--gold-light); }
  .brand small { font-family: var(--font-body); font-size: 0.9375rem; color: var(--text-dim); margin-left: 0.625rem; font-weight: 700; }
  .chips { display: flex; gap: 0.375rem; flex-wrap: wrap; align-items: center; }
  .chip {
    background: var(--panel-2); color: var(--text-dim); border: 0.0625rem solid var(--line);
    border-radius: 62.4375rem; padding: 0.375rem 0.875rem; font-size: 0.875rem; font-weight: 700; cursor: pointer;
    min-height: 2.125rem; text-decoration: none; display: inline-flex; align-items: center; user-select: none;
  }
  .chip:hover:not(:disabled) { color: var(--text); border-color: var(--text-dim); }
  .chip:disabled { opacity: .4; cursor: not-allowed; }
  .chip.hold:active { background: var(--gold); color: #2a1a00; }

  /* 메인 */
  .main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(18.75rem, 1fr); gap: 1rem; align-items: stretch; }
  .stage {
    justify-content: center;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,230,170,.16) 0%, transparent 55%), var(--wall);
    border: 0.0625rem solid var(--line); border-radius: 1.125rem; padding: 1.125rem 1.125rem 0.875rem;
    display: flex; flex-direction: column; align-items: center; gap: 0.625rem; position: relative; min-width: 0;
  }
  .art-frame { position: relative; width: 100%; max-width: min(100%, calc((100vh - 26rem) * 4 / 3)); min-width: 15rem; transition: transform .5s; }
  .art-frame canvas { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; }
  /* 등급별 액자 */
  .art-frame.t1 { padding: 0; transform: rotate(-1.5deg); box-shadow: 0 0.375rem 1rem rgba(0,0,0,.5); }
  .art-frame.t2 { padding: 0.625rem; background: #7a5532; box-shadow: inset 0 0 0 0.125rem #5a3c22, 0 0.5rem 1.125rem rgba(0,0,0,.5); }
  .art-frame.t3 { padding: 1rem; background: #111; box-shadow: inset 0 0 0 0.375rem #f4f1ea, 0 0.5rem 1.25rem rgba(0,0,0,.55); }
  .art-frame.t4 { padding: 1.125rem; background: linear-gradient(135deg, #a8792a, #f2cf7a 40%, #9a6a1e 70%, #e8c06a); box-shadow: inset 0 0 0 0.1875rem #6d4a12, 0 0.625rem 1.625rem rgba(0,0,0,.6); }
  .art-frame.t5 { padding: 1.625rem; background: linear-gradient(135deg, #8a5d12, #ffe39a 25%, #b8841f 50%, #fff0b8 70%, #8a5d12);
    box-shadow: inset 0 0 0 0.25rem #5e3d07, inset 0 0 0 0.625rem rgba(255,240,190,.35), 0 0 3.75rem 0.625rem rgba(246,217,139,.35), 0 0.75rem 1.875rem rgba(0,0,0,.6); }
  .art-frame.t5::after { content: ''; position: absolute; inset: -0.875rem; border-radius: 0.5rem; border: 0.125rem dashed rgba(246,217,139,.5); pointer-events: none; }
  .art-frame.enter { animation: artIn .7s ease-out; }
  @keyframes artIn { from { opacity: 0; transform: translateY(-1rem) scale(.96); } to { opacity: 1; } }

  .art-caption { text-align: center; }
  .art-tier { color: var(--text-dim); font-weight: 700; font-size: clamp(0.875rem, 1.4vw, 1.0625rem); }
  .art-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.375rem, 2.4vw, 2.25rem); line-height: 1.15; color: var(--text); display: flex; align-items: center; justify-content: center; gap: 0.75rem; flex-wrap: wrap; }
  .art-points { display: inline-block; background: var(--gold); color: #2a1a00; border-radius: 62.4375rem; padding: 0.25rem 1rem; font-weight: 900; font-size: clamp(1.125rem, 2vw, 1.625rem); }
  .art-stars { color: var(--gold); letter-spacing: 0.1875rem; font-size: clamp(1rem, 1.6vw, 1.375rem); }

  .sold-banner {
    position: absolute; top: 18%; left: 50%; transform: translateX(-50%) rotate(-6deg);
    background: #b3202b; color: #fff; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(1.625rem, 3.4vw, 2.875rem); padding: 0.5rem 1.75rem; border: 0.25rem solid #fff; border-radius: 0.5rem;
    box-shadow: 0 0.625rem 1.875rem rgba(0,0,0,.5); white-space: nowrap; animation: stamp .35s ease-out;
  }
  .sold-banner.unsold { background: #4b4b55; }
  @keyframes stamp { from { transform: translateX(-50%) rotate(-6deg) scale(2.2); opacity: 0; } to { transform: translateX(-50%) rotate(-6deg) scale(1); opacity: 1; } }

  .side { display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }
  .card { background: var(--panel); border: 0.0625rem solid var(--line); border-radius: 1rem; padding: 1rem; }
  .round-big { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.875rem, 3.6vw, 3.125rem); color: var(--gold-light); line-height: 1; }
  .round-sub { color: var(--text-dim); font-weight: 700; margin-top: 0.25rem; }
  .msg { font-weight: 700; font-size: clamp(0.9375rem, 1.5vw, 1.1875rem); line-height: 1.5; text-wrap: balance; }
  .btn {
    border: none; border-radius: 0.875rem; cursor: pointer; font-weight: 900; min-height: 3.75rem; width: 100%;
    font-size: clamp(1.125rem, 1.9vw, 1.5rem); padding: 0.625rem 0.875rem; transition: transform .08s;
  }
  .btn:active:not(:disabled) { transform: translateY(0.125rem); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-gold { background: var(--gold); color: #2a1a00; }
  .btn-red { background: #c22d38; color: #fff; }
  .btn-blue { background: #3b6fd8; color: #fff; }
  .btn-ghost { background: transparent; color: var(--text); border: 0.125rem solid var(--line); }
  .btn-row { display: flex; flex-direction: column; gap: 0.625rem; }
  .milestone-note { color: var(--gold-light); font-weight: 700; font-size: 0.9375rem; text-align: center; }

  /* 모둠 카드 */
  .teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.375rem, 1fr)); gap: 0.75rem; }
  .tcard { background: var(--panel); border: 0.125rem solid var(--line); border-radius: 1rem; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; }
  .tcard.lead { border-color: var(--gold); }
  .t-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.375rem; }
  .t-name { font-weight: 900; font-size: clamp(1rem, 1.6vw, 1.3125rem); overflow-wrap: anywhere; min-width: 0; }
  .t-rank { color: var(--text-dim); font-weight: 700; font-size: 0.8125rem; white-space: nowrap; }
  .t-points { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.75rem, 2.6vw, 2.5rem); line-height: 1; }
  .t-points.neg { color: var(--bad); }
  .t-points small { font-size: .45em; color: var(--text-dim); font-family: var(--font-body); }
  .flip { perspective: 50rem; height: 4rem; }
  .flip-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.2,.8,.2,1); }
  .flip.flipped .flip-inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 0.75rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.25rem; padding: 0.375rem; text-align: center; }
  .face.front { background: var(--panel-2); color: var(--text-dim); font-weight: 800; font-size: 1rem; }
  .face.front.done { background: #23402f; color: var(--good); }
  .face.back { transform: rotateY(180deg); background: #24161a; border: 0.0625rem solid var(--line); }
  .tag { border-radius: 0.5rem; padding: 0.1875rem 0.625rem; font-weight: 900; font-size: clamp(0.8125rem, 1.25vw, 1rem); white-space: nowrap; }
  .tag.win { background: var(--win); color: #2a1a00; }
  .tag.void { background: var(--void); color: #1f0b3a; }
  .tag.lose { background: var(--lose); color: #06203f; }
  .tag.none { color: var(--text-dim); font-weight: 700; }

  .credit { text-align: center; color: var(--text-dim); font-size: 0.7812rem; line-height: 1.6; }
  .credit a { color: var(--text-dim); }

  /* 모달 공통 */
  .modal { position: fixed; inset: 0; background: rgba(10,4,6,.86); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 50; }
  .modal-card { background: var(--panel); border: 0.0625rem solid var(--line); border-radius: 1.125rem; padding: 1.25rem; width: 100%; max-width: 53.75rem; max-height: 92vh; overflow: auto; }
  .modal-card h3 { margin: 0 0 0.375rem; font-size: 1.375rem; }
  .modal-card .hint { color: var(--text-dim); margin: 0 0 0.875rem; font-size: 0.875rem; line-height: 1.5; }

  /* 가림 입력 */
  .bid-layout { display: grid; grid-template-columns: minmax(0, 1fr) 17.5rem; gap: 1rem; }
  .bid-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.375rem, 1fr)); gap: 0.5rem; align-content: start; }
  .bid-field { background: var(--panel-2); border: 0.125rem solid var(--line); border-radius: 0.75rem; padding: 0.625rem; cursor: pointer; text-align: left; color: var(--text); }
  .bid-field.active { border-color: var(--gold); box-shadow: 0 0 0 0.1875rem rgba(232,182,76,.3); }
  .bid-field .bn { font-weight: 800; font-size: 0.9375rem; overflow-wrap: anywhere; }
  .bid-field .bv { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.25rem; margin-top: 0.25rem; min-height: 2rem; }
  .bid-field .bv.empty { color: var(--text-dim); font-size: 0.875rem; letter-spacing: 0; font-weight: 700; }
  .bid-field .bv.shown { color: var(--gold-light); letter-spacing: 0; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
  .key { background: var(--panel-2); border: 0.0625rem solid var(--line); color: var(--text); border-radius: 0.75rem; min-height: 3.5rem; font-size: 1.5rem; font-weight: 900; cursor: pointer; }
  .key:active { background: var(--gold); color: #2a1a00; }
  .key.small { font-size: 1rem; }
  .modal-actions { display: flex; gap: 0.625rem; margin-top: 1rem; flex-wrap: wrap; }
  .modal-actions .btn { flex: 1 1 10rem; min-height: 3.375rem; }
  .peek-btn { user-select: none; -webkit-user-select: none; touch-action: none; }
  .error { color: var(--bad); font-weight: 800; min-height: 1.4em; margin-top: 0.5rem; }

  /* 총액 공개 */
  .reveal-amount { font-family: var(--font-display); font-weight: 700; font-size: clamp(3rem, 8vw, 6rem); color: var(--gold-light); text-align: center; margin: 0.625rem 0; }

  /* 표 */
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9375rem; }
  th, td { border-bottom: 0.0625rem solid var(--line); padding: 0.4375rem 0.5rem; text-align: center; white-space: nowrap; }
  th { color: var(--text-dim); font-weight: 800; position: sticky; top: 0; background: var(--panel); }
  td.art { text-align: left; }
  td.c-win { background: rgba(242,193,78,.22); color: var(--gold-light); font-weight: 900; }
  td.c-void { color: var(--void); text-decoration: line-through; }
  td.c-lose { color: var(--lose); }
  tfoot td { font-weight: 900; border-top: 0.125rem solid var(--line); }
  .legend { display: flex; gap: 0.625rem; flex-wrap: wrap; font-size: 0.8125rem; color: var(--text-dim); margin: 0.5rem 0; }

  /* 설정 화면 */
  .setup { max-width: 45rem; margin: 3vh auto 0; width: 100%; }
  .setup h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.25rem, 5.4vw, 3.75rem); color: var(--gold-light); margin: 0; }
  .setup .lead { color: var(--text-dim); line-height: 1.6; margin: 0.375rem 0 1rem; }
  .field { margin-bottom: 1rem; }
  .field > label, .field > .lbl { display: block; font-weight: 800; margin-bottom: 0.375rem; }
  .field select, .field input[type=text] { width: 100%; padding: 0.625rem 0.75rem; border-radius: 0.625rem; border: 0.0625rem solid var(--line); background: var(--bg); color: var(--text); font-size: 1.0625rem; font-family: inherit; }
  .team-inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.75rem, 1fr)); gap: 0.5rem; }
  .check { display: flex; gap: 0.5rem; align-items: center; font-weight: 700; cursor: pointer; }
  .check input { width: 1.25rem; height: 1.25rem; accent-color: var(--gold); }
  .rules { color: var(--text-dim); font-size: 0.9375rem; line-height: 1.7; margin: 0; padding-left: 1.2em; }
  .rules b { color: var(--text); }

  /* 결과 화면 */
  .result { display: flex; flex-direction: column; gap: 0.875rem; }
  .result h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.125rem, 5vw, 3.75rem); color: var(--gold-light); margin: 0; text-align: center; }
  .rank-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(10.625rem, 1fr)); gap: 0.625rem; }
  .rank-card { background: var(--panel); border: 0.125rem solid var(--line); border-radius: 0.875rem; padding: 0.75rem; text-align: center; }
  .rank-card.first { border-color: var(--gold); background: #4a3418; }
  .rank-card.bankrupt { border-color: var(--bad); background: #4a1b20; }
  .rank-card .rk { font-weight: 900; color: var(--text-dim); }
  .rank-card .nm { font-weight: 900; font-size: 1.25rem; margin: 0.125rem 0; overflow-wrap: anywhere; }
  .rank-card .pt { font-family: var(--font-display); font-weight: 700; font-size: 2.125rem; }
  .rank-card .sp { color: var(--text-dim); font-weight: 700; }
  .rank-card .bk { display: inline-block; background: var(--bad); color: #fff; border-radius: 0.375rem; padding: 0.125rem 0.5rem; font-weight: 900; font-size: 0.8125rem; margin-top: 0.25rem; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  .rot-note { display: none; position: fixed; left: 0; right: 0; top: 0; z-index: 99; background: #f5c542; color: #2a1d00; text-align: center; font-weight: 900; padding: .5rem; font-size: 1rem; }
  html.portrait .rot-note { display: block; }
</style>
<script>
/* TV 가로 화면용: 1366×768을 기준으로 창 크기에 맞춰 전체 크기를 비례 조절 (모든 크기는 rem) */
(function(){
  function fit(){
    var s = Math.max(0.6, Math.min(innerWidth/1366, innerHeight/768, 3));
    document.documentElement.style.fontSize = (16*s) + 'px';
    document.documentElement.classList.toggle('portrait', innerHeight > innerWidth);
  }
  fit(); addEventListener('resize', fit);
})();
</script>

<body>
<div class="wrap" id="app"></div>

<!-- 가림 입력 창 -->
<div class="modal" id="bidModal" hidden>
  <div class="modal-card">
    <h3 id="bidTitle">입찰 금액 입력 (진행자)</h3>
    <p class="hint">모둠을 누르고 금액(만원)을 입력하세요. 숫자는 몇 자리든 ●●● 로 가려집니다. 키보드 숫자·Backspace·Tab(다음 모둠)도 쓸 수 있습니다.</p>
    <div class="bid-layout">
      <div class="bid-list" id="bidList"></div>
      <div>
        <div class="keypad" id="keypad"></div>
        <button class="btn btn-ghost peek-btn" id="peekBtn" style="margin-top:0.625rem; min-height:3rem; font-size:1rem;">👁 누르고 있는 동안만 보기</button>
      </div>
    </div>
    <div class="error" id="bidError"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeBidModal()">취소</button>
      <button class="btn btn-gold" onclick="submitBids()">입력</button>
    </div>
  </div>
</div>

<!-- 3라운드 총액 공개 -->
<div class="modal" id="totalModal" hidden>
  <div class="modal-card" style="max-width:35rem; text-align:center;">
    <h3 id="totalTitle">낙찰 총액 공개</h3>
    <p class="hint">지금까지 낙찰받은 모둠들이 실제로 쓴 금액의 합계입니다.</p>
    <div class="reveal-amount num" id="totalAmount">0만원</div>
    <div class="modal-actions"><button class="btn btn-gold" onclick="closeModal('totalModal')">닫기</button></div>
  </div>
</div>

<!-- 진행자 기록 (누르고 있는 동안만) -->
<div class="modal" id="hostModal" hidden style="pointer-events:none;">
  <div class="modal-card">
    <h3>🔒 진행자 기록 (손을 떼면 사라집니다)</h3>
    <div id="hostBody"></div>
  </div>
</div>

<!-- 확인 창 -->
<div class="modal" id="confirmModal" hidden>
  <div class="modal-card" style="max-width:27.5rem;">
    <h3 id="confirmTitle">확인</h3>
    <p class="hint" id="confirmText"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('confirmModal')">취소</button>
      <button class="btn btn-gold" id="confirmOk">확인</button>
    </div>
  </div>
</div>

<script>
/* ===================== 0. 설정값 ===================== */
const BACK_LINK = 'play.html';   // GitHub 버전에서는 'play.html'
const STORAGE_KEY = 'art_auction_v1';
const ROUND_OPTIONS = [9, 12, 15, 18, 21, 24, 27, 30];
const TIER_WEIGHTS = [27, 27, 26, 13, 7];   // 1~5점 확률(%)
const TIERS = {
  1: { name: '낙서 스케치', titles: ['공책 구석의 낙서', '연필 낙서', '지우개 자국 스케치', '심심할 때 그린 그림'] },
  2: { name: '동네 화가의 풍경화', titles: ['언덕 위의 집', '시골 마을의 오후', '강가의 풍경', '해 질 녘 들판'] },
  3: { name: '유명 화가의 판화', titles: ['색면 구성 No.7', '도형의 리듬', '푸른 구성', '겹쳐진 시간'] },
  4: { name: '왕실 초상화', titles: ['왕의 초상', '왕비의 초상', '어린 왕자의 초상', '대공의 초상'] },
  5: { name: '전설의 명화', titles: ['황금빛 소용돌이', '빛의 정원', '영원의 하늘', '불꽃의 춤'] }
};

/* ===================== 1. 효과음 ===================== */
const SOUND_KEY = 'art_auction_sound_v1';
const VOL_LEVELS = [{ name: '작게', mul: 0.45 }, { name: '보통', mul: 1 }, { name: '크게', mul: 1.8 }];

/* ===================== 3. 상태 ===================== */
let S = null;
let history = [];
let animating = false;
let setupDraft = { teamCount: 4, names: [], totalRounds: 12, guarantee5: true };
let bidDraft = [], activeBid = 0, peeking = false;

function rollTier(rand) {
  const total = TIER_WEIGHTS.reduce((a, b) => a + b, 0); let x = rand() * total;
  for (let i = 0; i < 5; i++) { if (x < TIER_WEIGHTS[i]) return i + 1; x -= TIER_WEIGHTS[i]; }
  return 1;
}
function makeRounds(n, guarantee5) {
  const rounds = Array.from({ length: n }, () => {
    const tier = rollTier(Math.random);
    const titles = TIERS[tier].titles;
    return { tier, title: titles[Math.floor(Math.random() * titles.length)], seed: Math.floor(Math.random() * 1e9), bids: null, result: null };
  });
  if (guarantee5 && !rounds.some(r => r.tier === 5)) {
    const i = Math.floor(Math.random() * n);
    const t = TIERS[5].titles;
    rounds[i].tier = 5; rounds[i].title = t[Math.floor(Math.random() * t.length)];
  }
  return rounds;
}
function load() { try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) S = JSON.parse(raw); } catch (e) {} }
function save() { try { if (S) localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); else localStorage.removeItem(STORAGE_KEY); } catch (e) {} }
function snapshot() { history.push(JSON.stringify(S)); if (history.length > 120) history.shift(); }
function undo() { if (!history.length || animating) return; S = JSON.parse(history.pop()); save(); render(true); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const curRound = () => S.rounds[S.round - 1];

/* ===================== 4. 판정 (기존 초코 경매 규칙 그대로) ===================== */
// - 최저 입찰 모둠 모두 -1점
// - 높은 금액부터 보며, 그 금액을 쓴 모둠이 2개 이상이면 무효, 처음으로 단독인 금액의 모둠이 낙찰
// - 낙찰 모둠만 입찰 금액을 지출
function judge(bids) {
  const min = Math.min(...bids);
  const losers = bids.map((b, i) => b === min ? i : -1).filter(i => i >= 0);
  const count = {}; bids.forEach(b => { count[b] = (count[b] || 0) + 1; });
  const amounts = Object.keys(count).map(Number).sort((a, b) => b - a);
  let winner = null, winningBid = 0; const voidTeams = [];
  for (const a of amounts) {
    if (count[a] === 1) { winner = bids.indexOf(a); winningBid = a; break; }
    bids.forEach((b, i) => { if (b === a) voidTeams.push(i); });
  }
  return { winner, winningBid, voidTeams, losers };
}
function totals(upTo = S.rounds.length) {
  const n = S.teams.length; const pts = Array(n).fill(0), spent = Array(n).fill(0);
  S.rounds.slice(0, upTo).forEach(r => {
    if (!r.result) return;
    if (r.result.winner !== null) { pts[r.result.winner] += r.tier; spent[r.result.winner] += r.result.winningBid; }
    r.result.losers.forEach(i => { pts[i] -= 1; });
  });
  return { pts, spent };
}
function totalWinningSum(upTo) { return S.rounds.slice(0, upTo).reduce((a, r) => a + (r.result && r.result.winner !== null ? r.result.winningBid : 0), 0); }

/* ===================== 5. 진행 동작 ===================== */
function openBidModal() {
  if (animating) return;
  const r = curRound();
  bidDraft = r.bids ? r.bids.map(String) : S.teams.map(() => '');
  activeBid = Math.max(0, bidDraft.findIndex(v => v === '')); peeking = false;
  document.getElementById('bidTitle').innerText = `${S.round}라운드 입찰 금액 입력 (진행자)`;
  document.getElementById('bidError').innerText = '';
  renderBidModal();
  document.getElementById('bidModal').hidden = false;
}
function closeBidModal() { document.getElementById('bidModal').hidden = true; peeking = false; }
function renderBidModal() {
  document.getElementById('bidList').innerHTML = S.teams.map((t, i) => {
    const v = bidDraft[i];
    const shown = peeking && v !== '';
    return `<button class="bid-field ${i === activeBid ? 'active' : ''}" onclick="selectBid(${i})">
      <div class="bn">${esc(t)}</div>
      <div class="bv ${v === '' ? 'empty' : ''} ${shown ? 'shown' : ''}">${v === '' ? '비어 있음' : shown ? esc(v) + '만원' : '●●●'}</div></button>`;
  }).join('');
}
function selectBid(i) { activeBid = i; sfx('click'); renderBidModal(); }
function keyPress(k) {
  let v = bidDraft[activeBid];
  if (k === 'back') v = v.slice(0, -1);
  else if (k === 'clear') v = '';
  else if (k === 'next') { activeBid = (activeBid + 1) % S.teams.length; renderBidModal(); return; }
  else if (/^\d$/.test(k)) { if (v === '0') v = ''; if (v.length < 6) v += k; }
  bidDraft[activeBid] = v; sfx('click');
  document.getElementById('bidError').innerText = '';
  renderBidModal();
}
function buildKeypad() {
  const keys = ['1','2','3','4','5','6','7','8','9','clear','0','back'];
  const label = { clear: '지우기', back: '⌫' };
  document.getElementById('keypad').innerHTML = keys.map(k => `<button class="key ${label[k] ? 'small' : ''}" onclick="keyPress('${k}')">${label[k] || k}</button>`).join('') +
    `<button class="key small" style="grid-column:1/-1;" onclick="keyPress('next')">다음 모둠 ▶</button>`;
}
function submitBids() {
  const empty = bidDraft.map((v, i) => v === '' ? S.teams[i] : null).filter(Boolean);
  if (empty.length) { document.getElementById('bidError').innerText = `${empty.join(', ')} 금액이 비어 있습니다.`; return; }
  snapshot();
  curRound().bids = bidDraft.map(v => parseInt(v, 10));
  curRound().result = null;
  S.stage = 'submitted';
  closeBidModal();
  sfx('bidDone');
  save(); render();
}
function revealRound() {
  if (animating || S.stage !== 'submitted') return;
  snapshot();
  const r = curRound();
  r.result = judge(r.bids);
  S.stage = 'revealed';
  save();
  // 연출: 두구두구 → 카드 뒤집기 → 결과 발표
  animating = true;
  render(false, { holdFlip: true });
  sfx('drumroll', 0, 1.3);
  setTimeout(() => {
    document.querySelectorAll('.flip').forEach(el => el.classList.add('flipped'));
    sfx('flip');
  }, 1350);
  setTimeout(() => {
    animating = false;
    render();
    const res = r.result;
    if (res.winner !== null) sfx('gavel');
    if (res.voidTeams.length) sfx('voidS', 0.8);
    if (res.losers.length) sfx('lose', res.voidTeams.length ? 1.15 : 0.8);
  }, 2150);
}
function nextRound() {
  if (animating) return;
  snapshot();
  if (S.round >= S.rounds.length) { S.phase = 'over'; save(); render(); setTimeout(playEnding, 300); return; }
  S.round++; S.stage = 'bidding';
  save(); render(true);
  sfx('art', 0.1, curRound().tier);
}
function showTotal() {
  const amt = totalWinningSum(S.round);
  document.getElementById('totalTitle').innerText = `📢 ${S.round}라운드 종료 · 지금까지의 낙찰 총액`;
  document.getElementById('totalAmount').innerText = `${amt.toLocaleString()}만원`;
  document.getElementById('totalModal').hidden = false;
  sfx('dudung');
}
function closeModal(id) { document.getElementById(id).hidden = true; }

/* ===================== 6. 최종 결과 계산 ===================== */
function finalStanding() {
  const { pts, spent } = totals();
  const maxSpent = Math.max(...spent);
  const bankrupt = maxSpent > 0 ? spent.map((s, i) => s === maxSpent ? i : -1).filter(i => i >= 0) : [];
  const order = S.teams.map((name, i) => ({ i, name, pts: pts[i], spent: spent[i], bankrupt: bankrupt.includes(i) }))
    .sort((a, b) => (a.bankrupt - b.bankrupt) || (b.pts - a.pts));
  let rank = 0, prevKey = null;
  order.forEach((o, idx) => { const key = o.bankrupt ? 'B' : 'P' + o.pts; if (key !== prevKey) { rank = idx + 1; prevKey = key; } o.rank = o.bankrupt ? null : rank; });
  return { order, bankrupt };
}
function playEnding() {
  const { bankrupt, order } = finalStanding();
  if (bankrupt.length) sfx('bankrupt');
  if (order.some(o => o.rank === 1)) sfx('victory', bankrupt.length ? 1.8 : 0.2);
}

/* ===================== 7. 화면 그리기 ===================== */
function render(newArt = false, opt = {}) {
  const app = document.getElementById('app');
  if (!S) { app.innerHTML = renderSetup(); bindSetup(); return; }
  if (S.phase === 'over') { app.innerHTML = renderTopbar() + renderResult(); return; }
  app.innerHTML = renderTopbar() + renderPlay(opt) + renderCredit();
  const r = curRound();
  const cv = document.getElementById('artCanvas');
  drawArt(cv, r.tier, r.seed);
  if (newArt) document.getElementById('artFrame').classList.add('enter');
}

function renderTopbar() {
  return `<div class="topbar">
    <div class="brand">무제한 명화 경매<small>${S.phase === 'over' ? '최종 결과' : `${S.round} / ${S.rounds.length} 라운드`}</small></div>
    <div class="chips">
      ${BACK_LINK ? `<a class="chip" href="${BACK_LINK}">← 놀이 목록</a>` : ''}
      <button class="chip" onclick="toggleSound()">${sound.on ? '🔊 효과음 켬' : '🔇 효과음 끔'}</button>
      <button class="chip" onclick="cycleVolume()" ${sound.on ? '' : 'disabled'}>음량: ${VOL_LEVELS[sound.level].name}</button>
      ${S.phase === 'play' ? `<button class="chip hold peek-btn" id="hostBtn">🔒 진행자 기록 보기 (누르는 동안)</button>` : ''}
      <button class="chip" onclick="undo()" ${history.length ? '' : 'disabled'}>↩️ 되돌리기</button>
      <button class="chip" onclick="newGame()">🔄 새 게임</button>
    </div>
  </div>`;
}

function renderPlay(opt) {
  const r = curRound();
  const { pts } = totals();
  const sorted = [...new Set(pts)].sort((a, b) => b - a);
  const anyResult = S.rounds.some(x => x.result);
  const stars = '★'.repeat(r.tier) + '☆'.repeat(5 - r.tier);
  const res = S.stage === 'revealed' && !opt.holdFlip ? r.result : null;
  const isMilestone = S.round % 3 === 0 && S.round < S.rounds.length;
  const isLast = S.round >= S.rounds.length;

  let banner = '';
  if (res) banner = res.winner !== null
    ? `<div class="sold-banner">🔨 낙찰! ${esc(S.teams[res.winner])}</div>`
    : `<div class="sold-banner unsold">유찰</div>`;

  let side;
  if (S.stage === 'bidding') {
    side = `<div class="msg">${esc(r.title)} 경매를 시작합니다. 모둠별로 입찰 금액을 쪽지에 적어 진행자에게 내세요.</div>
      <div class="btn-row"><button class="btn btn-gold" onclick="openBidModal()">🔒 입찰 금액 입력하기 (진행자)</button></div>`;
  } else if (S.stage === 'submitted') {
    side = `<div class="msg">모든 모둠의 입찰이 끝났습니다. 결과를 공개할까요?</div>
      <div class="btn-row">
        <button class="btn btn-red" onclick="revealRound()" ${animating ? 'disabled' : ''}>확인 (결과 공개)</button>
        <button class="btn btn-ghost" onclick="openBidModal()" style="min-height:2.875rem; font-size:1rem;">입찰 금액 다시 입력</button>
      </div>`;
  } else {
    const msgParts = [];
    if (r.result) {
      if (r.result.winner !== null) msgParts.push(`🔨 <b>${esc(S.teams[r.result.winner])}</b> 낙찰 (+${r.tier}점)`); else msgParts.push('단독 최고가가 없어 유찰되었습니다. (낙찰 없음)');
      if (r.result.voidTeams.length) msgParts.push(`⚖️ 동점 무효: ${r.result.voidTeams.map(i => esc(S.teams[i])).join(', ')}`);
      msgParts.push(`📉 최저가 감점(-1): ${r.result.losers.map(i => esc(S.teams[i])).join(', ')}`);
    }
    side = `<div class="msg">${opt.holdFlip ? '두구두구… 결과를 공개합니다!' : msgParts.join('<br>')}</div>
      ${isMilestone && !opt.holdFlip ? `<div class="milestone-note">📢 ${S.round}라운드 종료 — 낙찰 총액을 공개할 차례입니다.</div>` : ''}
      <div class="btn-row">
        ${isMilestone ? `<button class="btn btn-blue" onclick="showTotal()" ${opt.holdFlip ? 'disabled' : ''}>📢 낙찰 총액 공개</button>` : ''}
        <button class="btn btn-gold" onclick="nextRound()" ${opt.holdFlip ? 'disabled' : ''}>${isLast ? '🏆 최종 결과 보기' : `${S.round + 1}라운드 시작 ▶`}</button>
      </div>`;
  }

  const teams = S.teams.map((name, i) => {
    const rank = anyResult ? sorted.indexOf(pts[i]) + 1 : null;
    let front, flipped = false, back = '';
    if (S.stage === 'bidding') front = `<div class="face front">입찰 대기 중</div>`;
    else front = `<div class="face front done">입찰 완료 ✓</div>`;
    if (S.stage === 'revealed' && r.result) {
      flipped = !opt.holdFlip;
      const tags = [];
      if (r.result.winner === i) tags.push(`<span class="tag win">🏆 낙찰 +${r.tier}</span>`);
      if (r.result.voidTeams.includes(i)) tags.push(`<span class="tag void">⚖️ 동점 무효</span>`);
      if (r.result.losers.includes(i)) tags.push(`<span class="tag lose">📉 최저가 -1</span>`);
      back = `<div class="face back">${tags.length ? tags.join('') : '<span class="tag none">변동 없음</span>'}</div>`;
    }
    // 결과 공개 연출 중에는 점수를 바뀌기 전 값으로 보여 줌
    const shownPts = opt.holdFlip ? totals(S.round - 1).pts[i] : pts[i];
    return `<div class="tcard ${anyResult && rank === 1 && !opt.holdFlip ? 'lead' : ''}">
      <div class="t-head"><span class="t-name">${esc(name)}</span><span class="t-rank">${rank && !opt.holdFlip ? rank + '위' : ''}</span></div>
      <div class="t-points num ${shownPts < 0 ? 'neg' : ''}">${shownPts}<small> 점</small></div>
      <div class="flip ${flipped ? 'flipped' : ''}"><div class="flip-inner">${front}${back}</div></div>
    </div>`;
  }).join('');

  return `<div class="main">
    <div class="stage">
      <div class="art-frame t${r.tier}" id="artFrame"><canvas id="artCanvas" width="800" height="600" aria-label="${esc(TIERS[r.tier].name)}: ${esc(r.title)}"></canvas></div>
      <div class="art-caption">
        <div class="art-tier"><span class="art-stars" aria-hidden="true">${stars}</span> ${esc(TIERS[r.tier].name)}</div>
        <div class="art-title"><span>「${esc(r.title)}」</span><span class="art-points">${r.tier}점</span></div>
      </div>
      ${banner}
    </div>
    <div class="side">
      <div class="card"><div class="round-big num">${S.round}R</div><div class="round-sub">전체 ${S.rounds.length}라운드 · 3라운드마다 낙찰 총액 공개</div></div>
      <div class="card" style="display:flex; flex-direction:column; gap:0.75rem;">${side}</div>
    </div>
  </div>
  <div class="teams">${teams}</div>`;
}

function bidTable(upTo, opts = {}) {
  const rows = S.rounds.slice(0, upTo).map((r, idx) => {
    const cells = S.teams.map((_, i) => {
      if (!r.bids) return '<td>-</td>';
      let cls = '';
      if (r.result) { if (r.result.winner === i) cls = 'c-win'; else if (r.result.voidTeams.includes(i)) cls = 'c-void'; else if (r.result.losers.includes(i)) cls = 'c-lose'; }
      const minus = r.result && r.result.losers.includes(i) && cls !== 'c-lose' ? ' <small style="color:var(--lose)">(-1)</small>' : '';
      return `<td class="${cls} num">${r.bids[i]}${minus}</td>`;
    }).join('');
    return `<tr><td class="num">${idx + 1}R</td><td class="art">${'★'.repeat(r.tier)} ${esc(r.title)}</td>${cells}</tr>`;
  }).join('');
  const { spent, pts } = totals(upTo);
  return `<div class="legend"><span style="color:var(--gold-light)">■ 낙찰</span><span style="color:var(--void)">■ 동점 무효</span><span style="color:var(--lose)">■ 최저가 감점 ((-1)은 무효·낙찰과 동시에 감점)</span><span>(단위: 만원)</span></div>
  <div class="table-wrap"><table>
    <thead><tr><th>라운드</th><th>작품</th>${S.teams.map(t => `<th>${esc(t)}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="2">누적 지출</td>${spent.map(s => `<td class="num">${s}</td>`).join('')}</tr>
    ${opts.showPts ? `<tr><td colspan="2">점수</td>${pts.map(p => `<td class="num">${p}</td>`).join('')}</tr>` : ''}</tfoot>
  </table></div>`;
}

function renderResult() {
  const { order, bankrupt } = finalStanding();
  const winners = order.filter(o => o.rank === 1).map(o => o.name);
  const head = winners.length ? `🏆 ${esc(winners.join(', '))} 우승!` : '모든 모둠 파산!';
  const cards = order.map(o => `<div class="rank-card ${o.rank === 1 ? 'first' : ''} ${o.bankrupt ? 'bankrupt' : ''}">
    <div class="rk">${o.bankrupt ? '파산 (최하위)' : o.rank + '위'}</div>
    <div class="nm">${esc(o.name)}</div>
    <div class="pt num">${o.pts}점</div>
    <div class="sp num">누적 지출 ${o.spent.toLocaleString()}만원</div>
    ${o.bankrupt ? '<div class="bk">💸 파산 패배</div>' : ''}
  </div>`).join('');
  return `<div class="result">
    <h1>${head}</h1>
    <div class="credit" style="font-size:0.9375rem;">${bankrupt.length ? `누적 지출이 가장 많은 ${bankrupt.map(i => esc(S.teams[i])).join(', ')} 파산!` : '파산한 모둠이 없습니다.'}</div>
    <div class="rank-grid">${cards}</div>
    <div class="card"><div style="font-weight:900; margin-bottom:0.25rem;">📜 라운드별 전체 입찰 금액 공개</div>${bidTable(S.rounds.length, { showPts: true })}</div>
    ${renderCredit()}
  </div>`;
}

function renderCredit() {
  return `<div class="credit">규칙 출처: 블레스유 선생님의 「무제한 초코 경매」 자료 · <a href="https://indischool.com/boards/libRecreation/37327221" target="_blank" rel="noopener">indischool.com/boards/libRecreation/37327221</a><br>낙찰 모둠만 지출 · 동점 입찰 무효(단독 차순위 낙찰) · 최저가 -1점 · 마지막에 누적 지출 최다 모둠 파산</div>`;
}

function renderSetup() {
  const n = setupDraft.teamCount;
  const inputs = Array.from({ length: n }, (_, i) => `<input type="text" id="teamName${i}" maxlength="10" value="${esc(setupDraft.names[i] || `${i + 1}모둠`)}" aria-label="${i + 1}번째 모둠 이름">`).join('');
  const countOpts = [3,4,5,6,7,8].map(k => `<option value="${k}" ${k === n ? 'selected' : ''}>${k}개 모둠</option>`).join('');
  const roundOpts = ROUND_OPTIONS.map(k => `<option value="${k}" ${k === setupDraft.totalRounds ? 'selected' : ''}>${k}라운드</option>`).join('');
  return `<div class="setup">
    ${BACK_LINK ? `<a href="${BACK_LINK}" style="color:var(--text-dim); font-weight:700; text-decoration:none;">← 교실 놀이 수업실로</a>` : ''}
    <h1>무제한 명화 경매</h1>
    <p class="lead">돈은 무제한! 하지만 마지막에 가장 많이 쓴 모둠은 파산합니다. 매 라운드 무작위로 나오는 작품(1~5점)을 비공개 입찰로 낙찰받으세요.</p>
    <div class="card">
      <div class="field"><label for="teamCount">모둠 수</label><select id="teamCount">${countOpts}</select></div>
      <div class="field"><span class="lbl">모둠 이름</span><div class="team-inputs">${inputs}</div></div>
      <div class="field"><label for="totalRounds">라운드 수 (3라운드마다 낙찰 총액 공개)</label><select id="totalRounds">${roundOpts}</select></div>
      <div class="field"><label class="check"><input type="checkbox" id="guarantee5" ${setupDraft.guarantee5 ? 'checked' : ''}> 5점 「전설의 명화」 최소 1번 등장 보장</label></div>
      <div class="field"><span class="lbl">효과음</span><div class="chips">
        <button class="chip" onclick="toggleSound()">${sound.on ? '🔊 효과음 켬' : '🔇 효과음 끔'}</button>
        <button class="chip" onclick="cycleVolume()" ${sound.on ? '' : 'disabled'}>음량: ${VOL_LEVELS[sound.level].name} (눌러서 바꾸기)</button>
      </div></div>
      <div class="field"><span class="lbl">규칙</span><ul class="rules">
        <li>작품 점수는 1~3점이 자주, 4~5점은 드물게 나옵니다.</li>
        <li><b>가장 높은 금액을 단독으로</b> 쓴 모둠이 낙찰받고, 그 금액을 지출합니다. 같은 금액끼리는 무효입니다.</li>
        <li><b>가장 낮은 금액</b>을 쓴 모둠은 -1점입니다.</li>
        <li>입찰 금액은 공개되지 않습니다. 3라운드마다 지금까지의 낙찰 총액만 공개합니다.</li>
        <li>마지막에 <b>누적 지출이 가장 많은 모둠은 파산</b>하여 최하위가 됩니다.</li>
      </ul></div>
      <button class="btn btn-gold" onclick="startGame()">경매 시작</button>
    </div>
    <div style="margin-top:0.75rem;">${renderCredit()}</div>
  </div>`;
}
function readSetupNames() { const a = []; for (let i = 0; i < setupDraft.teamCount; i++) { const el = document.getElementById('teamName' + i); a.push(el ? el.value : (setupDraft.names[i] || '')); } return a; }
function keepSetupDraft() {
  if (S || !document.getElementById('totalRounds')) return;
  setupDraft.names = readSetupNames();
  setupDraft.totalRounds = parseInt(document.getElementById('totalRounds').value, 10);
  setupDraft.guarantee5 = document.getElementById('guarantee5').checked;
}
function bindSetup() {
  document.getElementById('teamCount').onchange = e => { keepSetupDraft(); setupDraft.teamCount = parseInt(e.target.value, 10); render(); };
}
function startGame() {
  keepSetupDraft();
  const names = setupDraft.names.map((v, i) => v.trim() || `${i + 1}모둠`);
  S = { phase: 'play', teams: names, rounds: makeRounds(setupDraft.totalRounds, setupDraft.guarantee5), round: 1, stage: 'bidding' };
  history = [];
  save(); render(true);
  sfx('art', 0.1, curRound().tier);
}

/* ===================== 8. 확인 창 / 새 게임 ===================== */
let confirmAction = null;
function askConfirm(title, text, action) {
  document.getElementById('confirmTitle').innerText = title; document.getElementById('confirmText').innerText = text;
  confirmAction = action; document.getElementById('confirmModal').hidden = false;
}
document.getElementById('confirmOk').onclick = () => { const a = confirmAction; closeModal('confirmModal'); if (a) a(); };
function newGame() {
  askConfirm('새 게임을 시작할까요?', '지금까지의 모든 라운드 기록이 지워지고 설정 화면으로 돌아갑니다.', () => {
    if (S) { setupDraft.teamCount = S.teams.length; setupDraft.names = S.teams.slice(); setupDraft.totalRounds = S.rounds.length; }
    S = null; history = []; save(); render();
  });
}

/* ===================== 9. 누르고 있는 동안만 보기 ===================== */
function holdHandlers(el, onDown, onUp) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); onDown(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => el.addEventListener(t, onUp));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
holdHandlers(document.getElementById('peekBtn'), () => { peeking = true; renderBidModal(); }, () => { if (peeking) { peeking = false; renderBidModal(); } });
document.getElementById('app').addEventListener('pointerdown', e => {
  if (e.target.closest('#hostBtn')) {
    e.preventDefault();
    document.getElementById('hostBody').innerHTML = bidTable(S.round, { showPts: true });
    document.getElementById('hostModal').hidden = false;
  }
});
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => { document.getElementById('hostModal').hidden = true; }));

/* ===================== 10. 키보드 ===================== */
document.addEventListener('keydown', e => {
  if (!document.getElementById('bidModal').hidden) {
    if (/^\d$/.test(e.key)) { keyPress(e.key); e.preventDefault(); }
    else if (e.key === 'Backspace') { keyPress('back'); e.preventDefault(); }
    else if (e.key === 'Tab') { keyPress('next'); e.preventDefault(); }
    else if (e.key === 'Enter') { submitBids(); e.preventDefault(); }
    else if (e.key === 'Escape') closeBidModal();
    return;
  }
  if (e.key === 'Escape') { ['totalModal', 'confirmModal'].forEach(closeModal); }
});

/* ===================== 11. 시작 ===================== */
buildKeypad();
function boot() { load(); render(true); }
if (window.claude?.hot) {
  window.claude.hot.snapshot(() => ({ S, history }));
  if (window.claude.hot.ready) window.claude.hot.ready(d => { if (d && 'S' in d) { S = d.S; history = d.history || []; render(); } else boot(); });
  else boot();
} else boot();
</script>
</body>
</html>
