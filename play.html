  <style>
    :root { --ink:#2b1d10; --bg:#fffdf8; --sun:#fcd34d; --c:#c2410c; --s:#ffedd5;
      --font-title:'Jua','Gowun Dodum',sans-serif; --font-body:'Gowun Dodum','Noto Sans KR',sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:var(--font-body); background:var(--bg); color:var(--ink); min-height:100vh; }
    a { color:inherit; text-decoration:none; }
    :focus-visible { outline:3px solid #2563eb; outline-offset:3px; }
    .topband { background:var(--ink); color:#fff6e5; padding:18px 24px 26px; }
    .topband-inner { max-width:960px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
    .back-btn { width:fit-content; background:var(--sun); color:var(--ink); border-radius:999px; padding:8px 18px; font-size:15px; min-height:44px; display:inline-flex; align-items:center; }
    h1 { margin:0; font-family:var(--font-title); font-weight:400; font-size:42px; line-height:1.2; color:var(--sun); }
    .subtitle { margin:0; font-size:18px; line-height:1.6; word-break:keep-all; }
    .page { max-width:960px; margin:0 auto; padding:28px 24px 64px; }
    .rows { display:flex; flex-direction:column; gap:12px; }
    .row { display:flex; align-items:center; gap:16px; border:3px solid var(--ink); border-radius:18px; padding:14px 18px; background:#fff; transition:transform .15s, box-shadow .15s; }
    a.row:hover { background:var(--s); transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink); }
    a.row:active { transform:translate(2px,2px); box-shadow:none; }
    .e { width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:30px; flex:none; background:var(--s); border:3px solid var(--c); }
    .t { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
    .t b { font-family:var(--font-title); font-weight:400; font-size:21px; line-height:1.3; }
    .d { font-size:15px; color:#4a3520; line-height:1.5; word-break:keep-all; }
    .g { font-style:normal; font-size:13px; font-weight:700; color:var(--c); background:var(--s); border-radius:999px; padding:3px 12px; flex:none; white-space:nowrap; }
    .go { font-size:22px; color:var(--c); flex:none; }
    .row.soon { border-style:dashed; background:transparent; color:#6b5238; }
    .row.soon .e { border-color:#6b5238; background:transparent; }
    @media (max-width:600px) { .topband { padding:14px 16px 20px; } h1 { font-size:32px; } .page { padding:22px 16px 48px; }
      .row { flex-wrap:wrap; padding:14px; gap:12px; } .t { flex-basis:calc(100% - 80px); } .go { display:none; } }
    @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
  </style>
</head>

      <a class="row" href="hapgyeol.html"><span class="e">🔺</span><span class="t"><b>결합 게임 (합! 결!)</b><span class="d">3×3 판에서 모양·색·바탕색이 모두 같거나 모두 다른 타일 3장을 찾는 관찰력 게임이에요.</span></span><i class="g">2~8조</i><span class="go" aria-hidden="true">→</span></a>
      <div class="row soon"><span class="e">＋</span><span class="t"><b>새로운 교실 놀이</b><span class="d">곧 추가될 예정이에요.</span></span></div>
    </div>

</html>
