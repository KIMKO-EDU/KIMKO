<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서류 출력실</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#2b1d10; --bg:#fffdf8; --sun:#fcd34d; --cream:#f5e6c8; --c:#6d28d9; --s:#ede9fe; --soft:#4a3520; --line:#e6d6b5;
      --font-title:'Jua','Gowun Dodum',sans-serif; --font-body:'Gowun Dodum','Noto Sans KR',sans-serif;
      --doc-font:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
    * { box-sizing:border-box; }
    html, body { margin:0; }
    body { font-family:var(--font-body); background:var(--bg); color:var(--ink); }
    button, input, select, textarea { font-family:inherit; color:inherit; font-size:inherit; }
    a { color:inherit; }
    :focus-visible { outline:3px solid #2563eb; outline-offset:2px; }
    [hidden] { display:none !important; }

    .topband { background:var(--ink); color:#fff6e5; padding:14px 24px 18px; }
    .topband-inner { max-width:1400px; margin:0 auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
    .back-btn { background:var(--sun); color:var(--ink); border-radius:999px; padding:8px 16px; font-size:15px; font-weight:700; min-height:40px; display:inline-flex; align-items:center; text-decoration:none; }
    .topband h1 { margin:0; font-family:var(--font-title); font-weight:400; font-size:30px; color:var(--sun); }
    .topband p { margin:0; font-size:15px; color:var(--cream); flex:1 1 300px; }

    .wrap { max-width:1400px; margin:0 auto; padding:18px 24px 60px; display:grid; grid-template-columns:400px minmax(0,1fr); gap:24px; align-items:start; }
    .panel { display:flex; flex-direction:column; gap:14px; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; padding:2px 6px 10px 2px; }

    .tpl-list { display:flex; flex-direction:column; gap:8px; }
    .tpl { display:flex; align-items:center; gap:10px; width:100%; min-height:48px; padding:8px 12px; border:3px solid var(--ink); border-radius:14px; background:#fff; cursor:pointer; text-align:left; font-size:16px; font-weight:700; }
    .tpl .em { font-size:22px; }
    .tpl .tag { margin-left:auto; font-size:12px; font-weight:700; background:var(--s); color:var(--c); border-radius:999px; padding:2px 8px; }
    .tpl[aria-pressed="true"] { background:var(--sun); box-shadow:3px 3px 0 var(--ink); }
    .row-btns { display:flex; gap:8px; flex-wrap:wrap; }
    .btn { min-height:42px; padding:6px 14px; border:3px solid var(--ink); border-radius:12px; background:#fff; cursor:pointer; font-weight:700; font-size:14px; display:inline-flex; align-items:center; gap:6px; }
    .btn:hover { background:#fff7e0; }
    .btn.main { background:var(--c); color:#fff; }
    .btn.main:hover { background:#5b21b6; }
    .btn.big { min-height:54px; font-family:var(--font-title); font-weight:400; font-size:20px; justify-content:center; flex:1; }
    .btn.warn { color:#b91c1c; }
    .btn.on { background:var(--sun); }
    .btn.small { min-height:34px; padding:3px 10px; font-size:13px; border-width:2px; }

    .card { border:3px solid var(--ink); border-radius:16px; background:#fff; padding:14px; display:flex; flex-direction:column; gap:12px; }
    .card h2 { margin:0; font-family:var(--font-title); font-weight:400; font-size:20px; display:flex; align-items:center; gap:8px; }
    .card h3 { margin:6px 0 0; font-size:14px; color:var(--c); }
    .note { font-size:13px; color:var(--soft); line-height:1.5; }
    .privacy { background:#ecfdf5; border:2px solid #15803d; border-radius:12px; padding:8px 12px; font-size:13px; color:#14532d; line-height:1.5; }

    .field { display:flex; flex-direction:column; gap:4px; }
    .field > label, .field > .lb { font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px; }
    .field .keep { font-size:11px; font-weight:700; background:#fef3c7; color:#92400e; border-radius:999px; padding:1px 7px; }
    .field input[type=text], .field input[type=number], .field input[type=date], .field input[type=time], .field textarea, .field select {
      width:100%; min-height:42px; padding:7px 10px; border:2px solid var(--ink); border-radius:10px; background:#fff; font-size:15px; }
    .field textarea { min-height:120px; resize:vertical; line-height:1.6; }
    .field .hint { font-size:12px; color:var(--soft); }
    .pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .seg { display:flex; flex-wrap:wrap; gap:6px; }
    .seg button { min-height:38px; padding:4px 12px; border:2px solid var(--ink); border-radius:999px; background:#fff; cursor:pointer; font-size:14px; }
    .seg button[aria-pressed="true"] { background:var(--c); color:#fff; }
    .chk { display:flex; align-items:center; gap:8px; min-height:40px; font-size:15px; cursor:pointer; }
    .chk input { width:20px; height:20px; accent-color:var(--c); }

    /* 미리보기 */
    .viewer { display:flex; flex-direction:column; gap:14px; min-width:0; }
    .vbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .vbar .pg { display:flex; gap:12px; flex-wrap:wrap; font-size:14px; }
    .pages { display:flex; flex-direction:column; gap:22px; align-items:center; }
    .holder { width:100%; max-width:860px; position:relative; }
    .holder.skip { opacity:.45; }
    .holder .plabel { font-size:13px; font-weight:700; margin-bottom:6px; color:var(--soft); }
    .scaler { position:relative; overflow:hidden; border:2px solid var(--ink); box-shadow:5px 5px 0 var(--ink); background:#fff; }
    .page { position:absolute; left:0; top:0; width:210mm; transform-origin:0 0; background:#fff; user-select:none; }
    .page img.bg { display:block; width:100%; height:100%; pointer-events:none; }
    .bx { position:absolute; display:flex; align-items:center; overflow:hidden; white-space:nowrap; color:#000; font-family:var(--doc-font); line-height:1.1; }
    .bx.al-center { justify-content:center; text-align:center; }
    .bx.al-right { justify-content:flex-end; text-align:right; }
    .bx.al-left { justify-content:flex-start; text-align:left; padding-left:1pt; }
    .bx.multi { display:block; white-space:pre-wrap; overflow-wrap:anywhere; word-break:keep-all; align-items:initial; }
    .bx.ring::after { content:''; position:absolute; inset:0; border:1.4pt solid #000; border-radius:50%; }
    .bx.mark { font-weight:700; }
    .bx.over { background:rgba(254,202,202,.55); }
    /* 편집 모드 */
    .editing .page { cursor:crosshair; }
    .editing .bx { outline:1.5px dashed #6d28d9; background:rgba(237,233,254,.45); cursor:move; overflow:visible; }
    .editing .bx.sel { outline:2px solid #db2777; background:rgba(252,231,243,.6); z-index:2; }
    .editing .bx .tagl { position:absolute; left:0; top:-13px; font:700 9px/12px var(--font-body); color:#fff; background:#6d28d9; padding:0 4px; border-radius:4px; white-space:nowrap; pointer-events:none; }
    .editing .bx.sel .tagl { background:#db2777; }
    .editing .bx .hd { position:absolute; right:-6px; bottom:-6px; width:12px; height:12px; background:#db2777; border:2px solid #fff; border-radius:3px; cursor:nwse-resize; }
    .editing .bx.hidden-when { opacity:.35; }
    .rubber { position:absolute; border:2px dashed #db2777; background:rgba(252,231,243,.4); pointer-events:none; }

    .modal { position:fixed; inset:0; z-index:50; background:rgba(43,29,16,.7); display:flex; align-items:center; justify-content:center; padding:16px; }
    .modal .card { width:100%; max-width:480px; max-height:90vh; overflow:auto; box-shadow:6px 6px 0 var(--ink); }
    .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff6e5; padding:10px 18px; border-radius:999px; font-size:14px; z-index:60; }

    @media (max-width:980px) {
      .wrap { grid-template-columns:1fr; padding:14px 14px 50px; }
      .panel { position:static; max-height:none; overflow:visible; }
    }

    /* 인쇄: 선택한 쪽만, 실제 크기로 */
    @page { size:A4; margin:0; }
    @media print {
      body { background:#fff; }
      body > *:not(.wrap) { display:none !important; }
      .wrap { display:block; padding:0; max-width:none; }
      .panel, .vbar, .holder .plabel, .holder.skip { display:none !important; }
      .viewer, .pages { display:block; gap:0; }
      .holder { max-width:none; width:auto; break-after:page; page-break-after:always; }
      .holder:last-child { break-after:auto; page-break-after:auto; }
      .scaler { border:0; box-shadow:none; overflow:visible; height:auto !important; }
      .page { position:relative; transform:none !important; }
      .bx { outline:none !important; background:none !important; }
      .bx .tagl, .bx .hd, .rubber { display:none !important; }
    }
  </style>
</head>

  </div></div>

      <div class="vbar" id="vbar"></div>

    </section>
  </div>

<script>
/* ===================== 서류 출력실 =====================
   - 양식(배경 그림) 위에 "칸"을 얹어 입력값을 그대로 출력
   - 입력한 학생 정보는 어디에도 저장하지 않음 (창을 닫으면 사라짐)
   - 양식(칸 위치 포함)만 이 브라우저 안(IndexedDB)에 저장
========================================================= */
'use strict';
const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
const PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
let pdfLib = null;
const TYPE_NAMES = { text: '짧은 글', longtext: '긴 글 (여러 줄)', number: '숫자', date: '날짜', time: '시각', choice: '선택지', check: '체크', days: '일수 자동 계산', hours: '시간 자동 계산' };

let templates = [];
let cur = null;                 // 현재 양식 id
const V = {};                   // 입력값 (메모리에만)
let editMode = false, sel = null;
const pageChoice = {};          // { tplId: { pageIdx: true/false } } 사용자가 직접 고른 인쇄 쪽
let autoPages = {};             // 이어쓰기로 필요해진 쪽

/* ---------- 작은 도우미 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = p => (p || 'id') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

/* ---------- IndexedDB (양식 저장) ---------- */
let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('kimko-forms', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('templates', { keyPath: 'id' });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  return dbp;
}
async function dbAll() { try { const d = await db(); return await new Promise((res, rej) => { const q = d.transaction('templates').objectStore('templates').getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error); }); } catch (e) { return []; } }
async function dbPut(t) { try { const d = await db(); await new Promise((res, rej) => { const tx = d.transaction('templates', 'readwrite'); tx.objectStore('templates').put(t); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); return true; } catch (e) { toast('이 브라우저에서는 양식을 저장할 수 없어요.'); return false; } }
async function dbDel(id) { try { const d = await db(); await new Promise((res, rej) => { const tx = d.transaction('templates', 'readwrite'); tx.objectStore('templates').delete(id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) {} }
let saveTimer = null;
function saveTpl(t) { t.modified = true; clearTimeout(saveTimer); saveTimer = setTimeout(() => dbPut(clone(t)), 300); }

/* ---------- 값 계산 ---------- */
function T() { return templates.find(t => t.id === cur); }
function varOf(t, key) { return t.vars.find(v => v.key === key); }
function rawVal(t, v) {
  if (V[v.key] !== undefined) return V[v.key];
  if (v.default === 'today') return todayISO();
  return v.default !== undefined ? v.default : '';
}
function calc(t, v) {
  if (v.type === 'days') {
    const a = val(t, v.from), b = val(t, v.to);
    if (!a) return '';
    const s = new Date(a + 'T00:00'), e = new Date((b || a) + 'T00:00');
    if (isNaN(s) || isNaN(e) || e < s) return '';
    let n = 0;
    for (let d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) { const w = d.getDay(); if (!v.weekdays || (w !== 0 && w !== 6)) n++; }
    return String(n);
  }
  if (v.type === 'hours') {
    const a = val(t, v.from), b = val(t, v.to);
    if (!a || !b) return '';
    const [h1, m1] = a.split(':').map(Number), [h2, m2] = b.split(':').map(Number);
    const mins = (h2 * 60 + m2) - (h1 * 60 + m1);
    if (!(mins > 0)) return '';
    const h = mins / 60; return Number.isInteger(h) ? String(h) : h.toFixed(1);
  }
  return '';
}
function val(t, key) {
  const v = varOf(t, key); if (!v) return '';
  const r = rawVal(t, v);
  if ((v.type === 'days' || v.type === 'hours') && (r === '' || r == null)) return calc(t, v);
  return r;
}
function shown(t, when) { return !when || val(t, when.key) === when.eq; }

function fmtBox(t, b) {
  const v = varOf(t, b.key); if (!v) return '';
  const x = val(t, b.key), f = b.fmt || 'text';
  if (f.startsWith('check:')) return x === f.slice(6) ? '✔' : '';
  if (f.startsWith('mark:')) return x === f.slice(5) ? '○' : '';
  if (f.startsWith('ring:')) return '';
  if (f === 'check') return x === true ? '✔' : '';
  if (f === 'mark') return x === true ? '○' : '';
  if (x === '' || x == null || x === false) return '';
  if (v.type === 'date') {
    const m = String(x).match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return '';
    const Y = m[1], M = String(+m[2]), D = String(+m[3]);
    return { Y, M, D, 'YMD.': `${Y}. ${M}. ${D}.`, YMDk: `${Y}년 ${M}월 ${D}일`, MDk: `${M}월 ${D}일`, 'MD.': `${M}. ${D}.` }[f] || `${Y}. ${M}. ${D}.`;
  }
  if (v.type === 'time') {
    const m = String(x).match(/^(\d{1,2}):(\d{2})/); if (!m) return '';
    return { H: String(+m[1]), m: m[2], HM: `${+m[1]}:${m[2]}` }[f] || `${+m[1]}:${m[2]}`;
  }
  return String(x);
}
function ringOn(t, b) { return (b.fmt || '').startsWith('ring:') && val(t, b.key) === b.fmt.slice(5); }
function fmtChoices(v) {
  if (!v) return [['text', '입력한 그대로']];
  switch (v.type) {
    case 'date': return [['Y', '연도만 (2026)'], ['M', '월만 (11)'], ['D', '일만 (3)'], ['YMD.', '2026. 11. 3.'], ['YMDk', '2026년 11월 3일'], ['MDk', '11월 3일'], ['MD.', '11. 3.']];
    case 'time': return [['H', '시만 (9)'], ['m', '분만 (30)'], ['HM', '9:30']];
    case 'check': return [['check', '체크하면 ✔'], ['mark', '체크하면 ○']];
    case 'choice': {
      const a = [['text', '고른 내용을 글자로']];
      (v.options || []).forEach(o => { a.push(['check:' + o, `✔ — "${o}" 고를 때`]); a.push(['mark:' + o, `○ — "${o}" 고를 때`]); a.push(['ring:' + o, `동그라미 표시 — "${o}" 고를 때`]); });

        <div class="field"><label for="pX">가로 위치</label><input type="number" id="pX" step="0.5" value="${b.x}"></div>
        <div class="field"><label for="pY">세로 위치</label><input type="number" id="pY" step="0.5" value="${b.y}"></div>
        <div class="field"><label for="pW">너비</label><input type="number" id="pW" step="0.5" value="${b.w}"></div>
        <div class="field"><label for="pH">높이</label><input type="number" id="pH" step="0.5" value="${b.h}"></div>
      </div>
      <div class="row-btns"><button type="button" class="btn" id="pDup">⧉ 복제</button><button type="button" class="btn warn" id="pDel">🗑 칸 지우기</button></div>`;
  }
  const vars = t.vars.map((x, i) => `<div class="tpl" style="cursor:default;font-weight:400;font-size:14px;min-height:42px">
      <span style="flex:1"><b>${esc(x.key)}</b> <span class="note">${TYPE_NAMES[x.type]}${x.keep ? ' · 기억' : ''}${x.when ? ' · 조건' : ''}</span></span>
      <button type="button" class="btn small" data-vup="${i}" aria-label="위로">↑</button><button type="button" class="btn small" data-vdn="${i}" aria-label="아래로">↓</button>
      <button type="button" class="btn small" data-ved="${i}">수정</button><button type="button" class="btn small warn" data-vdel="${i}">삭제</button></div>`).join('');
  p.innerHTML = `
    <div class="card"><h2>✏️ 칸 편집: ${esc(t.name)}</h2>${b ? '' : ''}${props}</div>
    <div class="card"><h2>📋 입력 항목 (${t.vars.length})</h2><p class="note">왼쪽 입력 화면에 이 순서대로 나와요. 이름이 같은 항목은 다른 양식과 값을 함께 써요.</p>
      <div class="tpl-list">${vars || '<p class="note">아직 없어요.</p>'}</div>
      <div class="row-btns"><button type="button" class="btn" id="vNew">＋ 입력 항목 추가</button></div></div>
    <div class="card"><h2>🗂 양식 관리</h2>
      <div class="row-btns">
        <button type="button" class="btn" id="tRen">이름 바꾸기</button>
        <button type="button" class="btn" id="tDup">복제</button>
        <button type="button" class="btn" id="tExp">💾 양식 파일로 내보내기</button>
        ${t.builtin ? (t.modified ? '<button type="button" class="btn warn" id="tReset">기본 양식으로 되돌리기</button>' : '') : '<button type="button" class="btn warn" id="tDel">양식 삭제</button>'}
      </div><p class="note">양식 파일을 다른 선생님께 보내면 "양식 파일 불러오기"로 그대로 쓸 수 있어요. 입력한 학생 정보는 파일에 들어가지 않아요.</p></div>
    <div class="row-btns"><button type="button" class="btn big main" id="doneEdit">✅ 편집 끝내기</button></div>`;
  $('#doneEdit').onclick = () => { editMode = false; sel = null; renderAll(); };
  $('#vNew').onclick = () => varModal(t, null, k => { renderEditPanel(); });
  p.querySelectorAll('[data-ved]').forEach(x => x.onclick = () => varModal(t, t.vars[+x.dataset.ved], () => { renderViewer(); renderEditPanel(); }));
  p.querySelectorAll('[data-vdel]').forEach(x => x.onclick = () => {
    const v0 = t.vars[+x.dataset.vdel], used = t.boxes.filter(bb => bb.key === v0.key).length;
    if (!confirm(used ? `"${v0.key}" 항목을 쓰는 칸이 ${used}개 있어요. 항목을 지우면 그 칸들은 비어요. 지울까요?` : `"${v0.key}" 항목을 지울까요?`)) return;
    t.vars.splice(+x.dataset.vdel, 1); t.boxes.forEach(bb => { if (bb.key === v0.key) bb.key = ''; }); saveTpl(t); renderViewer(); renderEditPanel();
  });
  const mv = (i, d) => { const j = i + d; if (j < 0 || j >= t.vars.length) return; const a = t.vars; [a[i], a[j]] = [a[j], a[i]]; saveTpl(t); renderEditPanel(); };
  p.querySelectorAll('[data-vup]').forEach(x => x.onclick = () => mv(+x.dataset.vup, -1));
  p.querySelectorAll('[data-vdn]').forEach(x => x.onclick = () => mv(+x.dataset.vdn, 1));
  $('#tRen').onclick = () => { const n = prompt('양식 이름', t.name); if (n && n.trim()) { t.name = n.trim(); saveTpl(t); renderEditPanel(); } };
  $('#tDup').onclick = async () => { const c = clone(t); c.id = uid('t'); c.name = t.name + ' (복사본)'; c.builtin = false; c.created = Date.now(); await dbPut(c); templates.push(c); editMode = false; select(c.id); toast('복사본을 만들었어요.'); };
  $('#tExp').onclick = () => exportTemplate(t);
  if ($('#tReset')) $('#tReset').onclick = async () => { if (!confirm('칸 위치와 항목을 처음 상태로 되돌릴까요?')) return; await dbDel(t.id); const i = templates.indexOf(t); templates[i] = clone(BUILTIN.find(x => x.id === t.id)); sel = null; renderAll(); toast('기본 양식으로 되돌렸어요.'); };
  if ($('#tDel')) $('#tDel').onclick = async () => { if (!confirm(`"${t.name}" 양식을 지울까요? 되돌릴 수 없어요.`)) return; await dbDel(t.id); templates = templates.filter(x => x !== t); editMode = false; select(templates[0].id); };
  if (!b) return;
  const up = (fn, re) => { fn(); saveTpl(t); const el = document.querySelector(`#pages .bx[data-id="${CSS.escape(b.id)}"]`); if (el) placeBox(t, b, el); refreshBoxes(); if (re) renderEditPanel(); };
  $('#pVar').onchange = e => {
    if (e.target.value === '__new') { varModal(t, null, k => { b.key = k; b.fmt = defaultFmt(varOf(t, k)); if (varOf(t, k).type === 'longtext') { b.multi = true; } saveTpl(t); renderViewer(); renderEditPanel(); }, () => renderEditPanel()); return; }
    up(() => { b.key = e.target.value; const nv = varOf(t, b.key); if (!fmtChoices(nv).some(f => f[0] === b.fmt)) b.fmt = defaultFmt(nv); if (nv && nv.type === 'longtext') b.multi = true; }, true);
  };
  $('#pFmt').onchange = e => up(() => b.fmt = e.target.value);
  $('#pSize').oninput = e => up(() => b.size = Math.max(5, +e.target.value || 11));
  $('#pAlign').onchange = e => up(() => b.align = e.target.value);
  $('#pMulti').onchange = e => up(() => { b.multi = e.target.checked; if (!b.multi) delete b.next; }, true);
  if ($('#pLh')) $('#pLh').oninput = e => up(() => b.lh = Math.max(6, +e.target.value || 16));
  if ($('#pNext')) $('#pNext').onchange = e => up(() => { if (e.target.value) b.next = e.target.value; else delete b.next; });
  $('#pWhen').onchange = e => up(() => { if (e.target.value) b.when = JSON.parse(e.target.value); else delete b.when; });
  [['pX', 'x'], ['pY', 'y'], ['pW', 'w'], ['pH', 'h']].forEach(([id, k]) => $('#' + id).oninput = e => up(() => b[k] = +e.target.value || 0));
  $('#pDup').onclick = () => { const c = clone(b); c.id = uid('b'); c.x += 10; c.y += 10; delete c.next; t.boxes.push(c); sel = c.id; saveTpl(t); renderViewer(); renderEditPanel(); };
  $('#pDel').onclick = () => delBox(t, b);
}

/* ---------- 입력 항목 만들기/수정 창 ---------- */
function modal(html) { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="card" role="dialog" aria-modal="true">${html}</div>`; $('#modalRoot').appendChild(m); const f = m.querySelector('input,select,textarea,button'); if (f) f.focus(); m.addEventListener('keydown', e => { if (e.key === 'Escape') m.remove(); }); return m; }
function varModal(t, v, done, cancel) {
  const isNew = !v; v = v ? clone(v) : { key: '', type: 'text' };
  const dates = t.vars.filter(x => x.type === 'date').map(x => x.key), times = t.vars.filter(x => x.type === 'time').map(x => x.key);
  const opt = (a, c) => a.map(k => `<option ${k === c ? 'selected' : ''}>${esc(k)}</option>`).join('');
  const m = modal(`
    <h2>${isNew ? '＋ 새 입력 항목' : '입력 항목 수정'}</h2>
    <div class="field"><label for="vk">항목 이름</label><input type="text" id="vk" value="${esc(v.key)}" placeholder="예: 학생 이름"><span class="hint">다른 양식에도 같은 이름이 있으면 값을 함께 써요.</span></div>
    <div class="field"><label for="vt">종류</label><select id="vt">${Object.entries(TYPE_NAMES).map(([k, l]) => `<option value="${k}" ${k === v.type ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="field" id="vOptW"><label for="vo">선택지 (쉼표로 구분)</label><input type="text" id="vo" value="${esc((v.options || []).join(', '))}" placeholder="예: 가족여행, 친척 방문, 체험활동"></div>
    <div class="pair" id="vCalcW"><div class="field"><label for="vf">시작</label><select id="vf"></select></div><div class="field"><label for="vto">끝</label><select id="vto"></select></div></div>
    <label class="chk" id="vWkW"><input type="checkbox" id="vwk" ${v.weekdays !== false ? 'checked' : ''}> 주말 빼고 세기</label>
    <label class="chk" id="vTodayW"><input type="checkbox" id="vtd" ${v.default === 'today' ? 'checked' : ''}> 처음에 오늘 날짜 넣기</label>
    <label class="chk"><input type="checkbox" id="vkeep" ${v.keep ? 'checked' : ''}> 기억하기 (학년·반·담임 이름처럼 매번 같은 값)</label>
    <div class="field"><label for="vh">도움말 (선택)</label><input type="text" id="vh" value="${esc(v.hint || '')}"></div>
    <div class="row-btns"><button type="button" class="btn" id="vCancel">취소</button><button type="button" class="btn main" id="vOk">저장</button></div>`);
  const sync = () => {
    const ty = m.querySelector('#vt').value;
    m.querySelector('#vOptW').hidden = ty !== 'choice';
    m.querySelector('#vCalcW').hidden = !(ty === 'days' || ty === 'hours');
    m.querySelector('#vWkW').hidden = ty !== 'days';
    m.querySelector('#vTodayW').hidden = ty !== 'date';
    const src = ty === 'hours' ? times : dates;
    m.querySelector('#vf').innerHTML = opt(src, v.from); m.querySelector('#vto').innerHTML = opt(src, v.to);
  };
  m.querySelector('#vt').onchange = sync; sync();
  m.querySelector('#vCancel').onclick = () => { m.remove(); if (cancel) cancel(); };
  m.querySelector('#vOk').onclick = () => {
    const key = m.querySelector('#vk').value.trim(), ty = m.querySelector('#vt').value;
    if (!key) { toast('항목 이름을 적어 주세요.'); return; }
    if ((isNew || key !== v.key) && t.vars.some(x => x.key === key)) { toast('같은 이름의 항목이 이미 있어요.'); return; }
    if ((ty === 'days' || ty === 'hours') && (!m.querySelector('#vf').value || !m.querySelector('#vto').value)) { toast(ty === 'days' ? '먼저 날짜 항목 두 개를 만들어 주세요.' : '먼저 시각 항목 두 개를 만들어 주세요.'); return; }
    const nv = { key, type: ty };
    if (ty === 'choice') nv.options = m.querySelector('#vo').value.split(',').map(s => s.trim()).filter(Boolean);
    if (ty === 'days' || ty === 'hours') { nv.from = m.querySelector('#vf').value; nv.to = m.querySelector('#vto').value; }
    if (ty === 'days') nv.weekdays = m.querySelector('#vwk').checked;
    if (ty === 'date' && m.querySelector('#vtd').checked) nv.default = 'today';
    if (m.querySelector('#vkeep').checked) nv.keep = true;
    const h = m.querySelector('#vh').value.trim(); if (h) nv.hint = h;
    if (v.when) nv.when = v.when; if (v.group) nv.group = v.group; if (v.label) nv.label = v.label;
    if (isNew) t.vars.push(nv);
    else {
      const i = t.vars.findIndex(x => x.key === v.key); t.vars[i] = nv;
      if (key !== v.key) {   // 이름이 바뀌면 칸·계산·조건도 함께
        t.boxes.forEach(bb => { if (bb.key === v.key) bb.key = key; if (bb.when && bb.when.key === v.key) bb.when.key = key; });
        t.vars.forEach(x => { if (x.from === v.key) x.from = key; if (x.to === v.key) x.to = key; if (x.when && x.when.key === v.key) x.when.key = key; });
      }
      t.boxes.forEach(bb => { if (bb.key === key && !fmtChoices(nv).some(f => f[0] === bb.fmt)) bb.fmt = defaultFmt(nv); });
    }
    saveTpl(t); m.remove(); done(key);
  };
}

/* ---------- 새 양식 / 가져오기 / 내보내기 ---------- */
function readAs(file, how) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r[how](file); }); }
function imgSize(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function shrink(img, maxW) {
  const k = Math.min(1, maxW / img.naturalWidth), c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.88);
}
async function pagesFromFiles(files) {
  const out = []; let pageW = 595.28, pageH = 841.89;
  for (const f of files) {
    if (/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)) {
      if (!pdfLib) { try { pdfLib = await import(PDFJS); pdfLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; } catch (e) { throw new Error('load'); } }
      const pdf = await pdfLib.getDocument({ data: new Uint8Array(await readAs(f, 'readAsArrayBuffer')) }).promise;
      for (let i = 1; i <= pdf.numPages; i++) {
        const pg = await pdf.getPage(i), vp1 = pg.getViewport({ scale: 1 });
        if (!out.length) { pageW = vp1.width; pageH = vp1.height; }
        const vp = pg.getViewport({ scale: 200 / 72 }), c = document.createElement('canvas');
        c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        await pg.render({ canvasContext: g, viewport: vp }).promise;
        out.push({ bg: c.toDataURL('image/png'), label: (pdf.numPages > 1 ? i + '쪽' : '') });
      }
    } else if (/^image\//.test(f.type)) {
      const img = await imgSize(await readAs(f, 'readAsDataURL'));
      if (!out.length) { pageW = 595.28; pageH = 595.28 * img.naturalHeight / img.naturalWidth; }
      out.push({ bg: await shrink(img, 1700), label: '' });
    }
  }
  out.forEach((p, i) => { if (!p.label) p.label = out.length > 1 ? (i + 1) + '쪽' : '1쪽'; });
  return { pages: out, pageW, pageH };
}
function newTemplateModal() {
  const m = modal(`
    <h2>＋ 새 양식 추가</h2>
    <p class="note">학교 양식을 <b>PDF</b>나 <b>사진(이미지)</b>으로 올려 주세요. 한글(HWP) 파일은 한글에서 <b>"PDF로 저장"</b>한 뒤 올리면 돼요.</p>
    <div class="field"><label for="nName">양식 이름</label><input type="text" id="nName" placeholder="예: 조퇴 신청서"></div>
    <div class="field"><label for="nEmoji">아이콘 (이모지, 선택)</label><input type="text" id="nEmoji" placeholder="📄" maxlength="4"></div>
    <div class="field"><label for="nFile">양식 파일</label><input type="file" id="nFile" accept="application/pdf,image/*" multiple></div>
    <p class="note" id="nMsg"></p>
    <div class="row-btns"><button type="button" class="btn" id="nCancel">취소</button><button type="button" class="btn main" id="nOk">만들기</button></div>`);
  m.querySelector('#nCancel').onclick = () => m.remove();
  m.querySelector('#nOk').onclick = async () => {
    const name = m.querySelector('#nName').value.trim(), files = [...m.querySelector('#nFile').files], msg = m.querySelector('#nMsg');
    if (!name) { toast('양식 이름을 적어 주세요.'); return; }
    if (!files.length) { toast('양식 파일을 골라 주세요.'); return; }
    msg.textContent = '양식을 읽는 중이에요…';
    try {
      const r = await pagesFromFiles(files);
      if (!r.pages.length) { msg.textContent = 'PDF나 이미지 파일만 올릴 수 있어요.'; return; }
      const t = { id: uid('t'), name, emoji: m.querySelector('#nEmoji').value.trim() || '📄', builtin: false, created: Date.now(), pageW: r.pageW, pageH: r.pageH, pages: r.pages, vars: [], boxes: [] };
      if (!await dbPut(t)) return;
      templates.push(t); m.remove(); cur = t.id; lsSet('forms_last', t.id); editMode = true; sel = null; renderAll();
      toast('양식이 추가됐어요. 이제 빈칸 위를 끌어서 칸을 만들어 보세요.');
    } catch (e) {
      msg.textContent = /load/.test(e.message) ? 'PDF를 읽는 도구를 불러오지 못했어요. 인터넷 연결을 확인하거나, 양식을 사진(이미지)으로 올려 주세요.' : '파일을 읽지 못했어요. 다른 파일로 다시 시도해 주세요.';
    }
  };
}
function exportTemplate(t) {
  const data = clone(t); delete data.modified;
  const blob = new Blob([JSON.stringify({ kind: 'kimko-form', version: 1, template: data })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `양식-${t.name}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importTemplate() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    try {
      const j = JSON.parse(await readAs(inp.files[0], 'readAsText')), t = j && j.template;
      if (!t || !Array.isArray(t.pages) || !Array.isArray(t.boxes) || !Array.isArray(t.vars) || !t.pages.every(p => /^data:image\//.test(p.bg))) throw new Error('bad');
      t.id = uid('t'); t.builtin = false; t.created = Date.now(); delete t.modified;
      if (templates.some(x => x.name === t.name)) t.name += ' (불러옴)';
      if (!await dbPut(t)) return;
      templates.push(t); select(t.id); toast(`"${t.name}" 양식을 불러왔어요.`);
    } catch (e) { toast('양식 파일이 아니거나 손상된 파일이에요.'); }
  };
  inp.click();
}

/* ---------- 시작 ---------- */
function renderAll() { renderPanel(); renderViewer(); }
let rz = null; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { scalePages(); }, 80); });
window.addEventListener('beforeprint', () => { if (editMode) { editMode = false; sel = null; renderAll(); } });
load();

</script>
