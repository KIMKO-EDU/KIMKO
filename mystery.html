<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>미스터리 타임 | KIMKO-EDU</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; background: #fffbf5; color: #1c1917; font-size: 16px; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .mono { font-variant-numeric: tabular-nums; }
    .muted { color: #78716c; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 18px; border-radius: 12px; font-weight: 800; border: 1px solid transparent; background: #4338ca; color: #fff; white-space: nowrap; }
    .btn:disabled { background: #e7e5e4 !important; color: #a8a29e !important; border-color: transparent !important; cursor: default; }
    .btn.amb { background: #f59e0b; color: #1c1917; }
    .btn.ghost { background: #fff; color: #3730a3; border-color: #c7d2fe; }
    .btn.big { padding: 14px 22px; font-size: 18px; border-radius: 14px; }
    .pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 11px; border-radius: 999px; font-size: 13.5px; font-weight: 700; white-space: nowrap; }
    .a-yes { background: #dcfce7; color: #15803d; }
    .a-no  { background: #fee2e2; color: #b91c1c; }
    .a-may { background: #fef3c7; color: #b45309; }
    .a-nul { background: #f1f5f9; color: #475569; }
    .a-wait { background: #eef2ff; color: #4338ca; }

    /* 입장 */
    .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 30px 20px; background: linear-gradient(180deg, #1e1b4b 0%, #312e81 100%); color: #fff; text-align: center; }
    .hero h1 { font-size: 34px; margin: 0; font-weight: 900; }
    .code-in { width: 260px; max-width: 80vw; text-align: center; font-size: 36px; font-weight: 900; letter-spacing: .25em; padding: 12px; border-radius: 14px; border: 3px solid #fbbf24; color: #1e1b4b; }
    .err { color: #fca5a5; font-weight: 700; min-height: 22px; }

    /* 모둠 고르기 */
    .page { max-width: 640px; margin: 0 auto; padding: 26px 20px 40px; }
    .seat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 14px; }
    .seat { border-radius: 16px; padding: 16px; background: #fff; border: 3px solid #e7e5e4; text-align: left; }
    .seat .n { font-size: 22px; font-weight: 900; }
    .seat .s { font-size: 13px; margin-top: 2px; }
    .seat.taken { background: #e7e5e4; color: #a8a29e; border-color: #e7e5e4; cursor: default; }
    .seat.pick { border-color: #f59e0b; box-shadow: 0 6px 16px rgba(245,158,11,.25); }
    .name-in { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #d6d3d1; margin-top: 6px; }

    /* 게임 */
    .top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #1e1b4b; color: #fff; flex-wrap: wrap; }
    .top .team { font-size: 19px; font-weight: 900; }
    .top .sp { flex: 1; }
    .top .pill { background: rgba(255,255,255,.12); color: #fff; }
    .game { display: grid; grid-template-columns: minmax(280px, 38%) 1fr; gap: 14px; padding: 14px; max-width: 1200px; margin: 0 auto; }
    .case-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 14px; display: block; }
    .story { white-space: pre-line; background: #fff; border: 1px solid #e7e5e4; border-radius: 12px; padding: 12px 14px; line-height: 1.6; margin-top: 10px; }
    .hints { background: #fef3c7; border-radius: 12px; padding: 11px 14px; margin-top: 10px; }
    .hints.flash { animation: flash 1s 3; }
    @keyframes flash { 50% { background: #fde68a; box-shadow: 0 0 0 4px #fbbf24; } }
    .hints ol { margin: 4px 0 0; padding-left: 20px; line-height: 1.6; font-size: 15px; color: #78350f; }
    .log { background: #fff; border: 1px solid #e7e5e4; border-radius: 14px; padding: 10px 14px; min-height: 200px; max-height: 50vh; overflow-y: auto; }
    .log-item { display: flex; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid #f5f5f4; flex-wrap: wrap; }
    .log-item:first-child { border-top: 0; }
    .log-item .q { flex: 1 1 200px; }
    .log-item.new { animation: flash2 1.2s 2; }
    @keyframes flash2 { 50% { background: #eef2ff; } }
    .ask { background: #f5f5f4; border-radius: 14px; padding: 12px; margin-top: 10px; }
    .ask input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #e7e5e4; background: #fff; }
    .ask .ins { display: grid; grid-template-columns: 1fr; gap: 7px; }
    .wait-msg { font-size: 14px; color: #4338ca; font-weight: 700; }

    /* 모달 · 결과 */
    .modal-bg { position: fixed; inset: 0; background: rgba(28,25,23,.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .modal { width: 480px; max-width: 100%; background: #fff; border-radius: 20px; padding: 22px; }
    .modal textarea { width: 100%; height: 170px; border: 2px solid #f59e0b; border-radius: 12px; padding: 12px; line-height: 1.55; resize: vertical; }
    .result { width: 380px; max-width: 100%; border-radius: 22px; padding: 30px 24px; text-align: center; }
    .result.ok { background: linear-gradient(160deg, #166534, #15803d); color: #fff; }
    .result.no { background: #fff7ed; color: #9a3412; }
    .kdots { display: flex; gap: 8px; justify-content: center; margin: 8px 0 4px; }
    .kdots span { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #fdba74; }
    .kdots span.on { background: #f59e0b; border-color: #f59e0b; }

    .end { max-width: 640px; margin: 0 auto; padding: 30px 20px; text-align: center; }
    .ans-box { text-align: left; white-space: pre-line; background: #fff; border: 1px solid #e7e5e4; border-radius: 14px; padding: 14px 16px; line-height: 1.7; margin-top: 14px; }
    mark { background: #fde68a; border-radius: 4px; padding: 0 3px; font-weight: 800; }

    @media (max-width: 820px) { .game { grid-template-columns: 1fr; } .log { max-height: none; } }
  </style>
</head>
<body>

<!-- 1. 방 코드 -->
<div id="vCode" class="hero hidden">
  <div style="font-size:48px;">🔍</div>
  <h1>미스터리 타임</h1>
  <div style="color:#c7d2fe;">선생님 화면의 방 코드를 입력하세요</div>
  <input id="codeIn" class="code-in mono" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="······">
  <button class="btn amb big" id="codeBtn" style="width:260px; max-width:80vw;">입장하기</button>
  <div class="err" id="codeErr"></div>
</div>

<!-- 2. 모둠 고르기 -->
<div id="vPick" class="page hidden">
  <div style="font-size:13px; font-weight:700; color:#b45309;" id="pickMeta"></div>
  <div style="font-size:26px; font-weight:900; margin-top:2px;">우리 모둠을 골라 주세요</div>
  <div class="muted" style="font-size:14px;">이 기기 한 대가 한 모둠이 됩니다</div>
  <div class="seat-grid" id="seatGrid"></div>
  <div style="margin-top:18px;"><div style="font-weight:700; font-size:14px;">모둠 이름 (선택, 12자 이내)</div>
    <input id="nameIn" class="name-in" maxlength="12" placeholder="예: 셜록 탐정단"></div>
  <button class="btn amb big" id="joinBtn" style="width:100%; margin-top:16px;" disabled>모둠을 골라 주세요</button>
</div>

<!-- 3. 게임 -->
<div id="vGame" class="hidden">
  <div class="top">
    <span class="team" id="gTeam"></span><span id="gName" style="font-size:14px; color:#c7d2fe;"></span>
    <span class="sp"></span>
    <span class="pill mono">남은 시간 <b id="gRemain" style="font-size:17px; color:#fbbf24;">--:--</b></span>
    <span class="pill mono">우리 기록 <b id="gScore" style="font-size:17px;">--:--</b> <span id="gPen" style="color:#fca5a5;"></span></span>
  </div>

  <!-- 대기 중 -->
  <div id="gLobby" class="end hidden">
    <div style="font-size:54px;">🕵️</div>
    <div style="font-size:24px; font-weight:900; margin-top:6px;">입장 완료!</div>
    <div class="muted" style="margin-top:6px; line-height:1.6;">선생님이 게임을 시작하면 사건이 나타나요.<br>그동안 규칙을 확인해 볼까요?</div>
    <div class="ans-box" id="ruleBox" style="font-size:15px;"></div>
  </div>

  <!-- 진행 중 -->
  <div id="gPlay" class="game hidden">
    <div>
      <img class="case-img" id="gImg" alt="">
      <div class="story" id="gStory"></div>
      <div class="hints" id="gHints"><b style="color:#92400e; font-size:14px;" id="gHintHead"></b><ol id="gHintList"></ol></div>
    </div>
    <div>
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;"><b>우리 모둠 질문 기록</b><span class="muted" style="font-size:13px;">다른 모둠은 볼 수 없어요</span></div>
      <div class="log" id="gLog"></div>
      <div class="ask">
        <div class="ins">
          <input id="q1" maxlength="100" placeholder="질문 ① (예/아니요로 답할 수 있게)">
          <input id="q2" maxlength="100" placeholder="질문 ② (선택)">
          <input id="q3" maxlength="100" placeholder="질문 ③ (선택)">
        </div>
        <div style="display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap;">
          <span class="wait-msg" id="askInfo"></span><span style="flex:1"></span>
          <button class="btn" id="askBtn">질문 보내기</button>
          <button class="btn amb" id="guessOpen">🎯 정답 제출</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 종료 -->
  <div id="gEnd" class="end hidden"></div>
</div>

<!-- 메시지 -->
<div id="vMsg" class="hero hidden"><div style="font-size:44px;">🔍</div><div id="msgText" style="font-size:20px; font-weight:700; line-height:1.6;"></div><button class="btn amb" id="msgBtn" onclick="location.href=location.pathname">처음으로</button></div>

<!-- 정답 제출 창 -->
<div id="mGuess" class="modal-bg hidden">
  <div class="modal">
    <div style="font-size:22px; font-weight:900;">🎯 사건의 전말 제출</div>
    <div class="muted" style="font-size:14px; margin:4px 0 10px;">왜 그런 일이 생겼는지 <b>원인 → 결과</b> 순서로 써 주세요.</div>
    <textarea id="guessIn" maxlength="500" placeholder="예: ~해서 ~했고, 그래서 ~했다."></textarea>
    <div style="background:#eef2ff; color:#3730a3; border-radius:10px; padding:9px 12px; font-size:14px; margin-top:8px;" id="guessKeyInfo"></div>
    <div style="background:#fef2f2; color:#b91c1c; border-radius:10px; padding:9px 12px; font-size:14px; margin-top:6px;" id="guessPenInfo"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:12px;"><button class="btn ghost" id="guessCancel">취소</button><button class="btn amb" id="guessSend">제출하기</button></div>
  </div>
</div>

<!-- 판정 결과 -->
<div id="mResult" class="modal-bg hidden"><div id="resultBox"></div></div>

<script type="module">
import {
  db, ready, now, esc, fmt, toast, explainError, EST, ANSWERS,
  elapsedSec, remainSec, teamScore, rankTeams, nextHintIn, ms,
  doc, getDoc, setDoc, updateDoc, collection, query, where, onSnapshot,
  writeBatch, serverTimestamp, increment
} from './mystery-firebase.js';

const $ = (id) => document.getElementById(id);
const VIEWS = ['vCode', 'vPick', 'vGame', 'vMsg'];
function view(v) { VIEWS.forEach(x => $(x).classList.toggle('hidden', x !== v)); }
function message(t) { $('msgText').innerHTML = t; view('vMsg'); }

let uid, code, room = null, teams = [], myMsgs = [], myTeamId = null, hadTeam = false;
let unsubs = [], msgUnsub = null, picked = null;
const seenVerdicts = new Set(); let msgsLoaded = false;
let lastHintCount = -1, lastAnswered = new Set();

try { uid = await ready(); }
catch (e) { message('연결 실패<br>' + esc(explainError(e))); throw e; }

// ============================================================
// 1. 방 코드 입력
// ============================================================
async function enter(c) {
  $('codeErr').textContent = '';
  if (!/^\d{6}$/.test(c)) { $('codeErr').textContent = '숫자 6자리를 입력하세요.'; view('vCode'); return; }
  let s;
  try { s = await getDoc(doc(db, 'rooms', c)); } catch (e) { $('codeErr').textContent = explainError(e); view('vCode'); return; }
  if (!s.exists()) { $('codeErr').textContent = '그 방을 찾을 수 없어요. 코드를 다시 확인하세요.'; view('vCode'); return; }
  code = c;
  history.replaceState(null, '', '?room=' + c);
  unsubs.push(onSnapshot(doc(db, 'rooms', c), (d) => { room = d.data(EST); render(); }));
  unsubs.push(onSnapshot(collection(db, 'rooms', c, 'teams'), (d) => { teams = d.docs.map(x => ({ id: x.id, ...x.data(EST) })); render(); }));
}
$('codeBtn').onclick = () => enter($('codeIn').value.trim());
$('codeIn').onkeydown = (e) => { if (e.key === 'Enter') enter($('codeIn').value.trim()); };
$('codeIn').oninput = () => { $('codeIn').value = $('codeIn').value.replace(/\D/g, ''); };

// ============================================================
// 전체 그리기
// ============================================================
function render() {
  if (!room) return;
  const mine = teams.find(t => t.uid === uid);
  if (mine) {
    if (myTeamId !== mine.id) { myTeamId = mine.id; hadTeam = true; listenMyMsgs(); }
  } else if (myTeamId) {
    myTeamId = null;
    toast('선생님이 우리 모둠 자리를 비웠어요. 모둠을 다시 골라 주세요.', 'error');
  }

  if (!myTeamId) {
    if (room.status === 'ended') { message('게임이 이미 끝났어요.<br>점수판을 봐 주세요!'); return; }
    renderPick(); return;
  }
  view('vGame');
  const t = teams.find(x => x.id === myTeamId);
  $('gTeam').textContent = `${t.id}모둠`;
  $('gName').textContent = t.name || '';
  ['gLobby', 'gPlay', 'gEnd'].forEach(x => $(x).classList.add('hidden'));
  if (room.status === 'lobby') { $('gLobby').classList.remove('hidden'); renderRules(); }
  else if (room.status === 'playing') { $('gPlay').classList.remove('hidden'); renderPlay(t); }
  else { $('gEnd').classList.remove('hidden'); renderEnd(t); }
  renderClock();
}

// ============================================================
// 2. 모둠 고르기
// ============================================================
function renderPick() {
  view('vPick');
  const s = room.settings;
  $('pickMeta').textContent = `방 ${code.slice(0, 3)} ${code.slice(3)} · ${room.title}`;
  let ids;
  if (s.teamMode === 'fixed') ids = Array.from({ length: s.teamCount }, (_, i) => String(i + 1));
  else {
    ids = teams.map(t => t.id).sort((a, b) => a - b);
    const free = Array.from({ length: 12 }, (_, i) => String(i + 1)).find(id => !teams.find(t => t.id === id));
    if (free) ids.push('new:' + free);
  }
  if (picked && !ids.includes(picked) && !ids.includes('new:' + picked)) picked = null;
  $('seatGrid').innerHTML = ids.map(raw => {
    const isNew = raw.startsWith('new:');
    const id = isNew ? raw.slice(4) : raw;
    const t = teams.find(x => x.id === id);
    if (t && t.uid) return `<button class="seat taken" disabled><div class="n">${id}모둠</div><div class="s">이미 사용 중</div></button>`;
    const sub = isNew ? '새 모둠 만들기' : t ? '비어 있어요 · 이어받기' : '비어 있어요';
    return `<button class="seat ${picked === id ? 'pick' : ''}" data-id="${id}"><div class="n">${isNew ? '＋ ' : ''}${id}모둠</div><div class="s" style="color:#b45309; font-weight:700;">${sub}</div></button>`;
  }).join('');
  $('seatGrid').querySelectorAll('[data-id]').forEach(b => b.onclick = () => { picked = b.dataset.id; renderPick(); });
  $('joinBtn').disabled = !picked;
  $('joinBtn').textContent = picked ? `${picked}모둠으로 들어가기` : '모둠을 골라 주세요';
}
$('joinBtn').onclick = async () => {
  if (!picked) return;
  const name = $('nameIn').value.trim().slice(0, 12);
  const ref = doc(db, 'rooms', code, 'teams', picked);
  const exist = teams.find(t => t.id === picked);
  $('joinBtn').disabled = true;
  try {
    if (exist) await updateDoc(ref, { uid, name: name || exist.name || '' });
    else await setDoc(ref, { uid, name, joinedAt: serverTimestamp(), questions: 0, wrong: 0, solved: false, solvedAtSec: null, bestKeys: 0, waiting: false, lastMsgId: '' });
  } catch (e) {
    toast((e.code || '').includes('permission') ? '다른 기기가 먼저 앉았어요. 다른 모둠을 골라 주세요.' : explainError(e), 'error');
    picked = null; renderPick();
  }
};

// ============================================================
// 3. 게임
// ============================================================
function renderRules() {
  const s = room.settings;
  $('ruleBox').innerHTML = `
    ⏱ 제한 시간은 <b>${fmt(s.limitSec)}</b>이에요.<br>
    ❓ 질문은 한 번에 <b>최대 3개</b>. 질문 1개마다 기록에 <b>+${fmt(s.qPenaltySec)}</b>.<br>
    ⏳ 선생님 답을 받아야 다음 질문을 보낼 수 있어요.<br>
    💬 선생님 답: 네 / 아니요 / 그럴 수도 있습니다 / 중요하지 않습니다<br>
    🎯 정답은 언제든 제출! 틀리면 <b>+${fmt(s.wrongPenaltySec)}</b>, 메인 키워드를 몇 개 찾았는지 알려 줘요.<br>
    💡 시간이 지나거나 정답 모둠이 나오면 힌트가 열려요.<br>
    🏆 기록이 가장 짧은 모둠이 1등!`;
}

function listenMyMsgs() {
  if (msgUnsub) msgUnsub();
  msgsLoaded = false;
  msgUnsub = onSnapshot(query(collection(db, 'rooms', code, 'messages'), where('uid', '==', uid)), (s) => {
    myMsgs = s.docs.map(d => ({ id: d.id, ...d.data(EST) }))
      .filter(m => m.teamNo === myTeamId)
      .sort((a, b) => (ms(a.createdAt) || 0) - (ms(b.createdAt) || 0));
    if (!msgsLoaded) { myMsgs.forEach(m => { if (m.verdict) seenVerdicts.add(m.id); if (m.status === 'answered') lastAnswered.add(m.id); }); msgsLoaded = true; }
    myMsgs.forEach(m => { if (m.verdict && !seenVerdicts.has(m.id)) { seenVerdicts.add(m.id); showResult(m); } });
    render();
  });
}

function renderPlay(t) {
  if ($('gImg').getAttribute('src') !== room.imageUrl) $('gImg').src = room.imageUrl;
  $('gStory').textContent = room.story;
  const hs = room.hintsRevealed || [];
  $('gHintList').innerHTML = hs.map(h => `<li>${esc(h)}</li>`).join('') || '<li style="list-style:none; margin-left:-20px; color:#a16207;">아직 공개된 힌트가 없어요</li>';
  if (lastHintCount >= 0 && hs.length > lastHintCount) {
    $('gHints').classList.remove('flash'); void $('gHints').offsetWidth; $('gHints').classList.add('flash');
    toast(`💡 새 힌트가 열렸어요! (${hs.length}/${room.hintCount})`);
  }
  lastHintCount = hs.length;
  renderHintHead();

  // 기록
  const items = [];
  myMsgs.forEach(m => {
    const isNew = m.status === 'answered' && !lastAnswered.has(m.id);
    if (m.kind === 'question') m.questions.forEach((q, i) => {
      const a = m.answers && ANSWERS[m.answers[i]];
      items.push(`<div class="log-item ${isNew ? 'new' : ''}"><span class="q">${esc(q)}</span>${a ? `<span class="pill ${a.cls}">${a.long}</span>` : '<span class="pill a-wait">⏳ 기다리는 중</span>'}</div>`);
    });
    else {
      const v = m.verdict === 'correct' ? '<span class="pill" style="background:#16a34a; color:#fff;">⭕ 정답!</span>'
        : m.verdict === 'wrong' ? `<span class="pill" style="background:#fff; color:#b45309; border:1px solid #fde68a;">🔑 ${m.keys} / ${room.mainCount}</span><span class="pill" style="background:#dc2626; color:#fff;">오답 +${fmt(room.settings.wrongPenaltySec)}</span>`
        : '<span class="pill a-wait">⏳ 확인 중</span>';
      items.push(`<div class="log-item ${isNew ? 'new' : ''}" style="background:${m.verdict === 'wrong' ? '#fef2f2' : m.verdict === 'correct' ? '#f0fdf4' : '#fffbeb'}; border-radius:8px; padding:7px 8px;"><span class="q">🎯 ${esc(m.guess)}</span>${v}</div>`);
    }
    if (isNew) lastAnswered.add(m.id);
  });
  const atBottom = $('gLog').scrollHeight - $('gLog').scrollTop - $('gLog').clientHeight < 40;
  $('gLog').innerHTML = items.join('') || '<div class="muted" style="padding:20px 0; text-align:center;">첫 질문을 보내 보세요! 🕵️</div>';
  if (atBottom) $('gLog').scrollTop = $('gLog').scrollHeight;

  // 질문 · 정답 버튼 상태
  const pendingGuess = myMsgs.some(m => m.kind === 'guess' && m.status === 'pending');
  const qp = fmt(room.settings.qPenaltySec);
  ['q1', 'q2', 'q3'].forEach(id => $(id).disabled = t.solved);
  if (t.solved) {
    $('askBtn').disabled = true; $('guessOpen').disabled = true;
    $('askInfo').textContent = '🎉 정답! 우리 모둠 기록이 멈췄어요. 다른 모둠을 응원해 주세요.';
  } else {
    $('askBtn').disabled = !!t.waiting;
    $('askBtn').textContent = `질문 보내기 (1개당 +${qp})`;
    $('askInfo').textContent = t.waiting ? '⏳ 선생님 답을 받으면 다음 질문을 보낼 수 있어요' : '';
    $('guessOpen').disabled = pendingGuess;
    $('guessOpen').textContent = pendingGuess ? '⏳ 정답 확인 중' : '🎯 정답 제출';
  }
}
function renderHintHead() {
  const hs = room.hintsRevealed || [];
  const n = nextHintIn(room, elapsedSec(room));
  $('gHintHead').textContent = `💡 힌트 ${hs.length} / ${room.hintCount}` + (n != null ? ` · 다음 힌트 ${fmt(n)} 후` : '');
}

function renderClock() {
  if (!room || !myTeamId) return;
  const t = teams.find(x => x.id === myTeamId); if (!t) return;
  const sc = teamScore(t, room);
  $('gRemain').textContent = room.status === 'ended' ? '종료' : fmt(remainSec(room));
  $('gScore').textContent = fmt(sc.score);
  $('gPen').textContent = sc.pen ? `(벌칙 +${fmt(sc.pen)})` : '';
  if (room.status === 'playing') renderHintHead();
}
setInterval(renderClock, 500);

// 질문 보내기
$('askBtn').onclick = async () => {
  const t = teams.find(x => x.id === myTeamId);
  const qs = ['q1', 'q2', 'q3'].map(id => $(id).value.trim()).filter(Boolean).slice(0, 3);
  if (!qs.length) { toast('질문을 한 개 이상 써 주세요.', 'error'); $('q1').focus(); return; }
  $('askBtn').disabled = true;
  try {
    const mref = doc(collection(db, 'rooms', code, 'messages'));
    const b = writeBatch(db);
    b.set(mref, { uid, teamNo: myTeamId, kind: 'question', questions: qs, guess: '', status: 'pending', createdAt: serverTimestamp() });
    b.update(doc(db, 'rooms', code, 'teams', myTeamId), { questions: increment(qs.length), waiting: true, lastMsgId: mref.id });
    await b.commit();
    ['q1', 'q2', 'q3'].forEach(id => $(id).value = '');
    toast(`질문 ${qs.length}개를 보냈어요!`, 'ok');
  } catch (e) {
    toast((e.code || '').includes('permission') ? '지금은 질문을 보낼 수 없어요. (답을 기다리는 중이거나 시간이 끝났어요)' : explainError(e), 'error');
    $('askBtn').disabled = !!(t && t.waiting);
  }
};
['q1', 'q2', 'q3'].forEach((id, i, arr) => $(id).onkeydown = (e) => { if (e.key === 'Enter') { if (i < 2 && $(arr[i + 1]).value === '' && $(id).value) $(arr[i + 1]).focus(); else $('askBtn').click(); } });

// 정답 제출
$('guessOpen').onclick = () => {
  $('guessKeyInfo').innerHTML = `✔ 꼭 들어가야 할 <b>메인 키워드는 ${room.mainCount}개</b>예요. 빠뜨린 게 없는지 확인해 보세요.`;
  $('guessPenInfo').innerHTML = `⚠️ 틀리면 우리 기록에 <b>+${fmt(room.settings.wrongPenaltySec)}</b>이 더해져요.`;
  $('mGuess').classList.remove('hidden'); $('guessIn').focus();
};
$('guessCancel').onclick = () => $('mGuess').classList.add('hidden');
$('guessSend').onclick = async () => {
  const g = $('guessIn').value.trim();
  if (g.length < 5) { toast('조금 더 자세히 써 주세요.', 'error'); return; }
  $('guessSend').disabled = true;
  try {
    await setDoc(doc(collection(db, 'rooms', code, 'messages')), { uid, teamNo: myTeamId, kind: 'guess', questions: [], guess: g, status: 'pending', createdAt: serverTimestamp() });
    $('mGuess').classList.add('hidden'); $('guessIn').value = '';
    toast('제출했어요! 선생님이 확인 중이에요.', 'ok');
  } catch (e) { toast((e.code || '').includes('permission') ? '지금은 제출할 수 없어요. (시간이 끝났어요)' : explainError(e), 'error'); }
  $('guessSend').disabled = false;
};

// 판정 결과 알림
function showResult(m) {
  const box = $('resultBox');
  if (m.verdict === 'correct') {
    const t = teams.find(x => x.id === myTeamId);
    const sc = t ? teamScore({ ...t, solved: true, solvedAtSec: t.solvedAtSec ?? 0 }, room) : null;
    box.className = 'result ok';
    box.innerHTML = `<div style="font-size:54px;">🎉</div><div style="font-size:30px; font-weight:900;">정답입니다!</div>
      <div style="color:#bbf7d0; margin-top:4px;">우리 모둠 기록이 멈췄어요</div>
      <div class="mono" style="font-size:40px; font-weight:900; color:#fde68a;">${sc ? fmt(sc.score) : ''}</div>
      <div style="font-size:14px; color:#dcfce7;">다른 모둠을 응원해 주세요</div>`;
  } else {
    const n = m.keys || 0, tot = room.mainCount;
    box.className = 'result no';
    box.innerHTML = `<div style="font-size:50px;">🤔</div><div style="font-size:27px; font-weight:900;">아쉬워요, 오답!</div>
      <div style="margin-top:4px;">우리 기록 <b>+${fmt(room.settings.wrongPenaltySec)}</b></div>
      <div style="background:#fff; border:1px solid #fed7aa; border-radius:14px; padding:12px; margin-top:12px;">
        <div style="font-size:13px; font-weight:700;">메인 키워드 ${tot}개 중</div>
        <div class="kdots">${Array.from({ length: tot }, (_, i) => `<span class="${i < n ? 'on' : ''}"></span>`).join('')}</div>
        <div style="font-size:20px; font-weight:900;">${n}개를 찾았어요!</div></div>
      <div style="font-size:14px; color:#78716c; margin-top:10px;">${n >= tot - 1 && n > 0 ? '거의 다 왔어요! ' : ''}질문으로 단서를 더 모아 보세요.</div>`;
  }
  $('mResult').classList.remove('hidden');
  setTimeout(() => $('mResult').classList.add('hidden'), 5000);
}
$('mResult').onclick = () => $('mResult').classList.add('hidden');

// 종료 화면
function renderEnd(t) {
  const list = rankTeams(teams, room);
  const me = list.find(x => x.id === t.id);
  const r = room.reveal;
  let ans = '';
  if (r) {
    let h = esc(r.answer);
    [...(r.main || []), ...(r.extra || [])].sort((a, b) => b.length - a.length).forEach(w => { const e = esc(w); h = h.split(e).join(`\u0000${e}\u0001`); });
    ans = `<div style="font-weight:800; margin-top:20px;">🔓 사건의 전말</div><div class="ans-box">${h.replace(/\u0000/g, '<mark>').replace(/\u0001/g, '</mark>')}</div>`;
  }
  $('gEnd').innerHTML = `
    <div style="font-size:54px;">${me && me.rank === 1 ? '🏆' : me && me.solved ? '🎉' : '🏁'}</div>
    <div style="font-size:26px; font-weight:900;">게임 종료!</div>
    <div style="margin-top:10px; font-size:18px;">우리 모둠 <b>${me ? me.rank : '-'}위</b> · 기록 <b class="mono">${me ? fmt(me.score) : '-'}</b></div>
    <div class="muted" style="margin-top:4px;">${me && me.solved ? '사건을 해결했어요!' : '이번엔 아쉽게 못 맞혔어요.'} 질문 ${t.questions || 0}개 · 오답 ${t.wrong || 0}번</div>
    ${ans || '<div class="muted" style="margin-top:20px;">선생님이 정답을 공개하면 여기에 나와요.</div>'}`;
}

// ============================================================
// 시작
// ============================================================
const qRoom = new URLSearchParams(location.search).get('room');
if (qRoom) { $('codeIn').value = qRoom; enter(qRoom); }
else view('vCode');
</script>
</body>
</html>
