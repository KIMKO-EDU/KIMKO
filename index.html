<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>체육 & 학급 활동 플랫폼</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Pretendard', sans-serif, -apple-system;
      margin: 0;
      padding: 50px 20px;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { font-size: 30px; margin-bottom: 8px; color: #0f172a; }
    p.subtitle { color: #64748b; margin-bottom: 40px; font-size: 15px; }
    .hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 680px;
    }
    .hub-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 28px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hub-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px -3px rgba(0,0,0,0.08);
      border-color: #3b82f6;
    }
    .icon { font-size: 40px; margin-bottom: 14px; }
    .title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .desc { font-size: 14px; color: #64748b; line-height: 1.5; }
    .action { margin-top: 20px; font-size: 14px; font-weight: 600; color: #2563eb; }
  </style>
</head>
<body>

  <h1>체육 & 학급 활동 웹 플랫폼</h1>
  <p class="subtitle">필요한 하위 카테고리를 선택하세요.</p>

  <div class="hub-grid">
    <!-- 스포츠스태킹 카테고리 -->
    <a href="stacking.html" class="hub-card">
      <div>
        <div class="icon">⏱️</div>
        <div class="title">스포츠스태킹 연구실</div>
        <div class="desc">스포츠스태킹 랭킹전 및 수업 관련 자료</div>
      </div>
      <div class="action">입장하기 →</div>
    </a>

    <!-- 놀이 수업 카테고리 -->
    <a href="play.html" class="hub-card">
      <div>
        <div class="icon">🎮</div>
        <div class="title">교실 놀이 수업실</div>
        <div class="desc">교실 놀이 활동 지원 프로그램</div>
      </div>
      <div class="action">입장하기 →</div>
    </a>
  </div>

</body>
</html>
