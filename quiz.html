<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>너무 쉬워서 누구나 맞힐 수 있는 퀴즈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#2b1d10; --sand:#e8d3a0; --sun:#fcd34d; --cream:#f5e6c8; --teal:#0f766e; --teal-text:#134e4a;
      --font-title:'Jua','Gowun Dodum',sans-serif; --font-body:'Gowun Dodum','Noto Sans KR',sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:var(--font-body); background:var(--sand); color:var(--ink); min-height:100vh; }
    a { color:inherit; text-decoration:none; }
    button { font-family:inherit; color:inherit; }
    :focus-visible { outline:3px solid #2563eb; outline-offset:3px; }
    .topband { background:var(--ink); color:#fff6e5; padding:18px 24px 26px; }
    .topband-inner { max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
    .back-btn { width:fit-content; background:var(--sun); color:var(--ink); border-radius:999px; padding:8px 18px; font-size:15px; min-height:44px; display:inline-flex; align-items:center; }
    .small { display:block; font-size:20px; font-weight:700; color:#5eead4; }
    h1 { margin:0; font-family:var(--font-title); font-weight:400; font-size:46px; line-height:1.2; color:var(--sun); word-break:keep-all; }
    .subtitle { margin:0; font-size:19px; line-height:1.6; }
    .page { max-width:1100px; margin:0 auto; padding:28px 24px 64px; display:flex; flex-direction:column; gap:26px; }
    .chips { display:flex; gap:10px; flex-wrap:wrap; }
    .chip { min-height:44px; padding:6px 18px; border:3px solid var(--ink); border-radius:999px; background:#fff; font-family:var(--font-title); font-size:17px; cursor:pointer; box-shadow:2px 2px 0 var(--ink); }
    .chip[aria-pressed="true"] { background:var(--teal); color:#fff; }
    .chip:active { transform:translate(2px,2px); box-shadow:none; }
    .grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:26px; }
    .vcard { background:#fff; border:4px solid var(--ink); border-radius:22px; overflow:hidden; box-shadow:6px 6px 0 var(--ink); display:flex; flex-direction:column; text-align:left; padding:0; cursor:pointer; width:100%; transition:transform .15s, box-shadow .15s; }
    .vcard:hover { transform:translate(-2px,-2px); box-shadow:8px 8px 0 var(--ink); }
    .vcard:active { transform:translate(3px,3px); box-shadow:3px 3px 0 var(--ink); }
    .thumb { position:relative; aspect-ratio:16/9; background:linear-gradient(135deg,#0f766e,#134e4a); border-bottom:4px solid var(--ink); display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .play { position:relative; width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.95); border:3px solid var(--ink); display:flex; align-items:center; justify-content:center; }
    .dur { position:absolute; right:10px; bottom:10px; background:var(--ink); color:#fff6e5; border-radius:8px; padding:2px 10px; font-size:14px; font-weight:700; }
    .vbody { padding:14px 18px 18px; display:flex; flex-direction:column; gap:8px; }
    .vtopic { width:fit-content; background:#ccfbf1; color:var(--teal-text); border:2px solid var(--ink); border-radius:999px; padding:1px 12px; font-size:14px; font-weight:700; }
    .vtitle { font-family:var(--font-title); font-size:22px; line-height:1.3; word-break:keep-all; }
    .empty { text-align:center; font-size:18px; padding:30px 0; }
    /* 재생 창 */
    .modal { position:fixed; inset:0; z-index:1000; background:rgba(43,29,16,.78); display:none; align-items:center; justify-content:center; padding:16px; }
    .modal.open { display:flex; }
    .mcard { width:100%; max-width:960px; background:#fff; border:4px solid var(--ink); border-radius:22px; box-shadow:8px 8px 0 var(--ink); overflow:hidden; }
    .mhead { background:var(--ink); color:var(--sun); padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .mhead h2 { margin:0; font-family:var(--font-title); font-weight:400; font-size:22px; word-break:keep-all; }
    .mx { min-width:44px; min-height:44px; border-radius:50%; border:2px solid var(--cream); background:transparent; color:#fff6e5; font-size:20px; cursor:pointer; }
    .frame { position:relative; aspect-ratio:16/9; background:#000; }
    .frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
    .soon { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff6e5; font-size:20px; text-align:center; padding:20px; }
    .mfoot { padding:12px 18px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; }
    .yt { min-height:44px; display:inline-flex; align-items:center; padding:6px 16px; border:3px solid var(--ink); border-radius:12px; background:var(--sun); font-family:var(--font-title); font-size:16px; }
    @media (max-width:900px) { .grid { grid-template-columns:repeat(2, minmax(0,1fr)); } }
    @media (max-width:600px) { .topband { padding:14px 16px 20px; } h1 { font-size:32px; } .small { font-size:17px; } .subtitle { font-size:16px; }
      .page { padding:22px 16px 52px; } .grid { grid-template-columns:1fr; gap:22px; } .vtitle { font-size:20px; } }
    @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  </style>
</head>
<body>
  <div class="topband"><div class="topband-inner">
    <a href="index.html" class="back-btn">← 메인으로 돌아가기</a>
    <div><span class="small">너무 쉬워서 🐥✨</span><h1>누구나 맞힐 수 있는 퀴즈</h1></div>
    <p class="subtitle">5분 안전교육 영상을 보고, 퀴즈를 풀어 봐요!</p>
  </div></div>

  <div class="page">
    <div class="chips" id="chips" role="group" aria-label="주제 고르기"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="mcard">
      <div class="mhead"><h2 id="mtitle"></h2><button class="mx" onclick="closeVideo()" aria-label="닫기">✕</button></div>
      <div class="frame" id="frame"></div>
      <div class="mfoot"><span style="font-size:15px">영상이 끝나면 퀴즈를 같이 풀어 보세요!</span><a class="yt" id="ytLink" href="#" target="_blank" rel="noopener">유튜브에서 보기 ↗</a></div>
    </div>
  </div>

<script>
/* ▼ 영상 목록: 여기만 고치면 돼요. id = 유튜브 주소 v= 뒤의 11글자, mins = 길이(분) */
const VIDEOS = [
  { id: '', title: '(예시) 횡단보도 안전하게 건너기', topic: '교통', mins: 5 },
  { id: '', title: '(예시) 불이 났을 때 대피 방법', topic: '화재', mins: 5 },
  { id: '', title: '(예시) 놀이터에서 다치지 않으려면', topic: '놀이터', mins: 5 },
  { id: '', title: '(예시) 자전거 탈 때 꼭 지킬 것', topic: '교통', mins: 5 },
  { id: '', title: '(예시) 소화기 사용법 따라 하기', topic: '화재', mins: 5 },
  { id: '', title: '(예시) 낯선 사람이 말을 걸 때', topic: '생활', mins: 5 }
];
let topic = '전체';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderChips() {
  const topics = ['전체'].concat(VIDEOS.map(v => v.topic).filter((t, i, a) => a.indexOf(t) === i));
  document.getElementById('chips').innerHTML = topics.map(t => `<button class="chip" aria-pressed="${t === topic}" onclick="setTopic('${esc(t)}')">${esc(t)}</button>`).join('');
}
function setTopic(t) { topic = t; renderChips(); renderGrid(); }
function renderGrid() {
  const list = VIDEOS.map((v, i) => ({ v, i })).filter(o => topic === '전체' || o.v.topic === topic);
  document.getElementById('grid').innerHTML = list.length ? list.map(o => `
    <button class="vcard" onclick="openVideo(${o.i})">
      <span class="thumb">${o.v.id ? `<img src="https://i.ytimg.com/vi/${o.v.id}/hqdefault.jpg" alt="" loading="lazy">` : ''}
        <span class="play"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#2b1d10"/></svg></span>
        <span class="dur">${o.v.mins}분</span></span>
      <span class="vbody"><span class="vtopic">${esc(o.v.topic)}</span><span class="vtitle">${esc(o.v.title)}</span></span>
    </button>`).join('') : '<div class="empty">이 주제의 영상은 아직 없어요.</div>';
}
let lastFocus = null;
function openVideo(i) {
  const v = VIDEOS[i]; lastFocus = document.activeElement;
  document.getElementById('mtitle').textContent = v.title;
  document.getElementById('frame').innerHTML = v.id
    ? `<iframe src="https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0" title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`
    : '<div class="soon">영상 주소를 넣으면 여기에서 재생돼요.</div>';
  document.getElementById('ytLink').href = v.id ? 'https://www.youtube.com/watch?v=' + v.id : '#';
  document.getElementById('modal').className = 'modal open';
  document.querySelector('#modal .mx').focus();
}
function closeVideo() {
  document.getElementById('frame').innerHTML = '';   /* 닫으면 소리도 같이 멈춤 */
  document.getElementById('modal').className = 'modal';
  if (lastFocus) try { lastFocus.focus(); } catch (e) {}
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVideo(); });
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeVideo(); });
renderChips(); renderGrid();
</script>
</body>
</html>
