<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- [적용 1] 모바일 뷰포트 메타 태그 추가 (화면 강제 축소 방지 및 글자 크기 정상화) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스포츠스태킹 관리자 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Pretendard', sans-serif, -apple-system; 
      background: #f1f5f9; 
      color: #1e293b; 
      margin: 0; 
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
      -webkit-text-size-adjust: 100%;
    }
    
    /* 상단 헤더 */
    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 24px; 
      padding-bottom: 16px; 
      border-bottom: 2px solid #e2e8f0; 
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { 
      margin: 0; 
      font-size: 24px; 
      color: #0f172a; 
      word-break: keep-all;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-link {
      text-decoration: none;
      color: #3b82f6;
      font-weight: bold;
      font-size: 15px;
      padding: 8px 4px;
    }
    .logout-btn { 
      background: #ef4444; 
      color: white; 
      border: none; 
      padding: 10px 16px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 14px;
      min-height: 40px;
    }
    
    /* 대시보드 그리드 */
    .dashboard-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 20px; 
      align-items: start; 
    }
    @media (max-width: 860px) { 
      .dashboard-grid { grid-template-columns: 1fr; } 
    }
    
    .panel { 
      background: white; 
      border-radius: 14px; 
      padding: 20px; 
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
      border: 1px solid #e2e8f0;
    }
    h2 { 
      margin-top: 0; 
      font-size: 18px; 
      color: #334155; 
      border-left: 4px solid #3b82f6; 
      padding-left: 10px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 8px;
      word-break: keep-all;
    }
    .count-badge { 
      font-size: 13px; 
      font-weight: 700; 
      color: #3b82f6; 
      background: #eff6ff; 
      padding: 4px 10px; 
      border-radius: 20px; 
      white-space: nowrap;
    }
    
    /* 랭킹 테이블 */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      text-align: center; 
      margin-top: 12px; 
    }
    th, td { 
      padding: 12px 8px; 
      border-bottom: 1px solid #e2e8f0; 
      font-size: 15px; 
      word-break: keep-all;
    }
    th { 
      background: #f8fafc; 
      font-weight: 700; 
      color: #475569; 
      font-size: 14px;
    }
    .rank-1 { color: #d97706; font-weight: 800; }
    .rank-2 { color: #64748b; font-weight: 800; }
    .rank-3 { color: #854d0e; font-weight: 800; }
    
    /* 검색 및 필터 (모바일 터치 최적화) */
    .filter-bar { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 16px; 
      width: 100%;
    }
    select, input { 
      padding: 10px 12px; 
      border: 1px solid #cbd5e1; 
      border-radius: 8px; 
      flex: 1; 
      font-size: 16px; /* 모바일 터치 시 자동 확대 방지 및 가독성 확보 */
      min-height: 46px;
      min-width: 0;
      background-color: #fff;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }
    .btn-action { 
      padding: 10px 18px; 
      background: #3b82f6; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 16px;
      min-height: 46px;
      white-space: nowrap;
    }
    .btn-action:hover { background: #2563eb; }
    
    /* 대기 알림 */
    .alert-box { 
      background: #fef2f2; 
      border: 1px solid #fecaca; 
      color: #991b1b; 
      padding: 14px; 
      border-radius: 10px; 
      margin-bottom: 20px; 
      display: none; 
      font-size: 14px;
      line-height: 1.5;
      word-break: keep-all;
    }
    
    #loading { 
      text-align: center; 
      font-size: 17px; 
      font-weight: bold; 
      padding: 40px 16px; 
      color: #3b82f6; 
      word-break: keep-all;
    }

    /* 기록 로그 리스트 스타일 */
    .log-list { 
      list-style: none; 
      padding: 0; 
      margin: 0; 
      border: 1px solid #e2e8f0; 
      border-radius: 8px; 
      overflow: hidden; 
    }
    .log-item { 
      padding: 14px 16px; 
      border-bottom: 1px solid #e2e8f0; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 15px; 
      background: #fff; 
    }
    .log-item:last-child { border-bottom: none; }
    .log-date { color: #64748b; font-size: 14px; }
    .log-score { font-weight: 800; color: #1d4ed8; font-size: 16px; }
    .btn-expand { 
      width: 100%; 
      margin-top: 12px; 
      padding: 14px; 
      background: #f8fafc; 
      border: 1px solid #cbd5e1; 
      border-radius: 8px; 
      cursor: pointer; 
      color: #475569; 
      font-weight: bold; 
      font-size: 15px;
      transition: 0.2s; 
    }
    .btn-expand:hover { background: #f1f5f9; }

    /* ========================================================
       [적용 2 & 3] 안드로이드/모바일 스마트폰 최적화 반응형 스타일
       ======================================================== */
    @media (max-width: 600px) {
      body {
        padding: 10px; /* 모바일 좌우 여백 최소화 */
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 16px;
        padding-bottom: 12px;
      }
      h1 {
        font-size: 19px;
        line-height: 1.35;
      }
      .header-actions {
        width: 100%;
        justify-content: space-between;
      }
      .dashboard-grid {
        gap: 14px;
      }
      .panel {
        padding: 16px 12px; /* 패널 내부 여백 축소로 표/차트 영역 확보 */
        border-radius: 12px;
      }
      h2 {
        font-size: 16px;
      }
      /* 학생 성장 검색바 모바일 비율 조정 */
      .growth-filter-bar {
        flex-wrap: wrap;
      }
      .growth-filter-bar input {
        flex: 1 1 55%;
      }
      .growth-filter-bar select {
        flex: 1 1 40%;
      }
      .growth-filter-bar .btn-action {
        flex: 1 1 100%; /* 모바일에서 조회 버튼을 큼직하게 아래 한 줄로 배치 */
      }
      th, td {
        padding: 10px 6px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>👨‍🏫 광주푸른초등학교 스포츠스태킹 통합 관리 시스템</h1>
    <div class="header-actions">
      <a href="student-record.html" class="back-link">← 기록실로 가기</a>
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <div id="loading">데이터를 불러오는 중입니다... 잠시만 기다려주세요! 🚀</div>

  <div id="dashboard" style="display:none;">
    
    <!-- 이상 기록 알림 -->
    <div class="alert-box" id="alertBox">
      <strong>🚨 승인 대기 기록 발생!</strong> 구글 스프레드시트의 '제출로그' 탭을 확인하여 비정상 기록을 점검해주세요.
    </div>

    <div class="dashboard-grid">
      <!-- 패널 1: 종목별 명예의 전당 (전체 학생 표시) -->
      <div class="panel">
        <h2>
          <span>🏆 종목별 통합 랭킹보드</span>
          <span id="rankingCount" class="count-badge">총 0명</span>
        </h2>
        <div class="filter-bar">
          <select id="eventFilter" onchange="renderRanking()">
            <option value="3-3-3">3-3-3</option>
            <option value="3-6-3">3-6-3</option>
            <option value="사이클">사이클</option>
            <option value="더블">더블</option>
            <option value="3-6-3릴레이">3-6-3릴레이</option>
            <option value="사이클릴레이">사이클릴레이</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>순위</th><th>소속</th><th>이름</th><th>최고기록</th></tr></thead>
            <tbody id="rankingBody"></tbody>
          </table>
        </div>
      </div>

      <!-- 패널 2: 개인별 성장 궤적 및 로그 -->
      <div class="panel">
        <h2>📈 학생별 성장 궤적 및 기록 로그</h2>
        <div class="filter-bar growth-filter-bar">
          <input type="text" id="searchName" placeholder="학생 이름 입력" onkeyup="if(event.key==='Enter') renderGrowth()">
          <select id="growthEventFilter">
            <option value="3-3-3">3-3-3</option>
            <option value="3-6-3">3-6-3</option>
            <option value="사이클">사이클</option>
            <option value="더블">더블</option>
            <option value="3-6-3릴레이">3-6-3릴레이</option>
            <option value="사이클릴레이">사이클릴레이</option>
          </select>
          <button class="btn-action" onclick="renderGrowth()">조회</button>
        </div>
        
        <canvas id="growthChart" height="220"></canvas>
        <p id="chartMsg" style="text-align:center; color:#64748b; font-size:14px; margin-bottom: 20px; word-break: keep-all;"></p>

        <!-- 최근 기록 리스트 영역 -->
        <div id="logContainer" style="display:none;">
          <h3 style="font-size: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 12px; color: #334155;">⏱️ 상세 기록 로그 (최신순)</h3>
          <ul id="logList" class="log-list"></ul>
          <button id="expandBtn" class="btn-expand" onclick="toggleExpand()" style="display: none;">더보기</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ★★★ 구글 Apps Script 웹 앱 URL ★★★
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2ABEw49MhLsZ750gZwc98vOH7lVyFmVyQ8EslfgZjs4a_II4fuAoGjHqsz4CKHGY/exec'; 
    
    let bestData = [];
    let logData = [];
    let growthChartInstance = null;
    let currentStudentLogs = []; // 현재 조회 중인 학생의 로그
    let isExpanded = false;      // 리스트 펼치기 상태

    // 보안 검증
    document.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('admin_verified') !== 'true') {
        alert('잘못된 접근입니다. 관리자 비밀번호를 입력해주세요.');
        window.location.href = 'student-record.html';
      } else {
        fetchAdminData();
      }
    });

    function logout() {
      sessionStorage.removeItem('admin_verified');
      window.location.href = 'student-record.html';
    }

    function fetchAdminData() {
      fetch(SCRIPT_URL + '?action=getAdminData')
        .then(res => res.json())
        .then(data => {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
          
          bestData = parseSheetData(data.best);
          logData = parseSheetData(data.log);
          
          checkPendingApprovals();
          renderRanking();
        })
        .catch(err => alert('데이터를 불러오지 못했습니다. 권한 설정이나 인터넷 연결을 확인하세요.'));
    }

    function parseSheetData(raw2DArray) {
      if(!raw2DArray || raw2DArray.length <= 1) return [];
      const headers = raw2DArray[0];
      return raw2DArray.slice(1).map(row => {
        let obj = {};
        headers.forEach((h, i) => obj[h] = row[i]);
        return obj;
      });
    }

    function checkPendingApprovals() {
      const hasPending = logData.some(log => log['승인상태'] && log['승인상태'].includes('승인대기'));
      if (hasPending) document.getElementById('alertBox').style.display = 'block';
    }

    // 랭킹 렌더링 (전체 학생 표시)
    function renderRanking() {
      const event = document.getElementById('eventFilter').value;
      
      let validRecords = bestData.filter(row => row[event] !== '' && row[event] !== '-' && !isNaN(parseFloat(row[event])));
      validRecords.sort((a, b) => parseFloat(a[event]) - parseFloat(b[event]));
      
      document.getElementById('rankingCount').innerText = `총 ${validRecords.length}명`;
      const tbody = document.getElementById('rankingBody');
      
      if (validRecords.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="color:#94a3b8; padding:24px;">아직 등록된 기록이 없습니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = validRecords.map((r, idx) => {
        const rank = idx + 1;
        let rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
        return `<tr>
          <td class="${rankClass}">${rank}위</td>
          <td>${r['학년']}학년 ${r['반']}반</td>
          <td>${r['이름']}</td>
          <td style="font-weight:bold;">${parseFloat(r[event]).toFixed(3)}s</td>
        </tr>`;
      }).join('');
    }

    // 학생 개인 성장 그래프 및 리스트 초기화
    function renderGrowth() {
      const name = document.getElementById('searchName').value.trim();
      const eventName = document.getElementById('growthEventFilter').value;
      const chartMsg = document.getElementById('chartMsg');
      const logContainer = document.getElementById('logContainer');
      
      if(!name) { 
        chartMsg.innerText = "이름을 입력해주세요."; 
        logContainer.style.display = 'none';
        return; 
      }

      // 해당 학생 & 선택 종목 로그만 필터링 (승인 완료된 기록만)
      let studentLogs = logData.filter(log => log['이름'] === name && log['종목'] === eventName && log['승인상태'] && log['승인상태'].includes('승인완료'));
      
      if(studentLogs.length === 0) {
        chartMsg.innerText = `${name} 학생의 ${eventName} 측정 데이터가 없습니다.`;
        if(growthChartInstance) growthChartInstance.destroy();
        logContainer.style.display = 'none';
        return;
      }

      // 최신순 정렬 (내림차순 - 리스트 표시용)
      studentLogs.sort((a, b) => new Date(b['타임스탬프']) - new Date(a['타임스탬프']));
      currentStudentLogs = studentLogs;
      isExpanded = false; // 검색 시 항상 접힌 상태로 초기화

      chartMsg.innerText = `${name} 학생의 ${eventName} 성장 그래프입니다. (제출일 기준)`;

      // 차트용 데이터 가공 (과거순 오름차순으로 보여주기 위해 reverse 복사)
      const chartLogs = [...studentLogs].reverse();
      const labels = chartLogs.map(log => {
        const d = new Date(log['타임스탬프']);
        return `${d.getMonth()+1}/${d.getDate()}`;
      });
      const dataPoints = chartLogs.map(log => parseFloat(log['측정기록']));

      // 차트 그리기
      const ctx = document.getElementById('growthChart').getContext('2d');
      if(growthChartInstance) growthChartInstance.destroy(); 

      growthChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: `${eventName} 기록 (초)`,
            data: dataPoints,
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59, 130, 246, 0.1)',
            borderWidth: 3,
            tension: 0.3,
            fill: true,
            pointBackgroundColor: '#1d4ed8',
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: { reverse: true, title: { display: true, text: '기록 (낮을수록 좋음)' } }
          }
        }
      });

      // 상세 로그 리스트 렌더링
      logContainer.style.display = 'block';
      renderLogList();
    }

    // 상세 로그 리스트 그리기 함수
    function renderLogList() {
      const ul = document.getElementById('logList');
      const expandBtn = document.getElementById('expandBtn');
      ul.innerHTML = '';
      
      // 펼치기 상태에 따라 보여줄 개수 결정 (기본 5개)
      const displayCount = isExpanded ? currentStudentLogs.length : Math.min(5, currentStudentLogs.length);
      
      for(let i = 0; i < displayCount; i++) {
        const log = currentStudentLogs[i];
        const d = new Date(log['타임스탬프']);
        // 날짜 포맷 (예: 2026.10.13 14:30)
        const dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        
        ul.innerHTML += `
          <li class="log-item">
            <span class="log-date">${dateStr}</span>
            <span class="log-score">${parseFloat(log['측정기록']).toFixed(3)}초</span>
          </li>
        `;
      }
      
      // 5개 이상일 경우 더보기 버튼 표시 및 텍스트 전환
      if(currentStudentLogs.length > 5) {
        expandBtn.style.display = 'block';
        expandBtn.innerText = isExpanded ? '접기 ▲' : `더보기 ▼ (총 ${currentStudentLogs.length}개 기록 펼치기)`;
      } else {
        expandBtn.style.display = 'none';
      }
    }

    // 더보기 버튼 클릭 시 동작
    function toggleExpand() {
      isExpanded = !isExpanded;
      renderLogList();
    }
  </script>
</body>
</html>
