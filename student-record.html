<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스포츠스태킹 자율 기록실</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Pretendard', sans-serif, -apple-system;
      background: #f0fdf4;
      color: #166534;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    
    /* 상단 네비게이션 */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .back-btn {
      text-decoration: none;
      color: #15803d;
      font-size: 14px;
      font-weight: 600;
    }
    .admin-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      border: 1px solid #dcfce7;
    }
    h1 {
      text-align: center;
      color: #14532d;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 16px;
    }
    
    /* 학생 정보 입력칸 (크기 비율 조정 적용) */
    .input-group { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 14px; 
      width: 100%;
    }
    .input-group input {
      padding: 12px;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
      min-width: 0;
    }
    #grade { flex: 1; }
    #cls { flex: 1; }
    #name { flex: 2.5; }
    
    .input-group input:focus {
      outline: none;
      border-color: #16a34a;
      box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.15);
    }
    
    .btn-search {
      width: 100%;
      background: #16a34a;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-search:hover { background: #15803d; }
    
    /* 조회 후 나타나는 기록판 및 입력 영역 */
    #recordBoard { display: none; }
    
    .record-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 10px; 
      margin: 16px 0 24px 0; 
    }
    .record-item {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .record-title { font-size: 13px; color: #166534; font-weight: 600; margin-bottom: 4px; }
    .record-score { font-size: 17px; font-weight: 800; color: #15803d; word-break: keep-all; }
    .record-empty { font-size: 14px; font-weight: 600; color: #94a3b8; }

    /* 새 기록 입력 영역 */
    .submit-area {
      background: #fdfae8;
      border: 2px dashed #fde047;
      padding: 20px;
      border-radius: 12px;
    }
    .submit-area h3 { margin: 0 0 12px 0; color: #854d0e; text-align: center; font-size: 16px; }
    
    .event-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .event-btn {
      padding: 10px;
      background: white;
      border: 1px solid #fde047;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-align: center;
      transition: all 0.15s;
    }
    .event-btn.selected {
      background: #eab308;
      color: white;
      font-weight: bold;
      border-color: #ca8a04;
    }

    .score-input-group { display: flex; gap: 8px; }
    .score-input {
      flex: 2;
      padding: 12px;
      border: 1px solid #fde047;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
    }
    .score-input:focus {
      outline: none;
      border-color: #ca8a04;
    }
    .btn-submit {
      flex: 1;
      background: #eab308;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-submit:hover { background: #ca8a04; }
    
    #loadingMsg { text-align: center; color: #166534; font-weight: bold; display: none; margin-top: 10px; }

    /* 직접 접속 차단용 잠금 화면 */
    #lockScreen {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .lock-input {
      padding: 12px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
      margin-bottom: 12px;
      width: 200px;
    }
  </style>
</head>
<body>

  <!-- 학교 코드 미인증 시 차단 카드 -->
  <div class="card" id="lockScreen">
    <div style="font-size:48px; margin-bottom:12px;">🔒</div>
    <h2>학교 코드 인증이 필요합니다</h2>
    <p style="color:#64748b; font-size:14px; margin-bottom:20px;">우리 학교 학생만 접근 가능한 페이지입니다.</p>
    <input type="password" id="directCodeInput" class="lock-input" placeholder="학교 코드" onkeypress="if(event.key==='Enter') unlockDirectly()"><br>
    <button class="btn-search" style="max-width:200px;" onclick="unlockDirectly()">인증 및 입장</button>
  </div>

  <!-- 실제 기록실 본문 (인증 완료 시
