<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스포츠스태킹 자율 기록실</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Pretendard', sans-serif, -apple-system;
      background: #f0fdf4;
      color: #166534;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    
    /* 상단 네비게이션 */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .back-btn {
      text-decoration: none;
      color: #15803d;
      font-size: 14px;
      font-weight: 600;
    }
    .admin-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      border: 1px solid #dcfce7;
    }
    h1 {
      text-align: center;
      color: #14532d;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 16px;
    }
    
    /* 학생 정보 입력칸 */
    .input-group { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 14px; 
      width: 100%;
    }
    .input-group input {
      padding: 12px;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
      min-width: 0;
    }
    #grade { flex: 1; }
    #cls { flex: 1; }
    #name { flex: 2.5; }
    
    .input-group input:focus {
      outline: none;
      border-color: #16a34a;
      box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.15);
    }
    
    .btn-search {
      width: 100%;
      background: #16a34a;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-search:hover { background: #15803d; }
    
    /* 기록판 및 입력 영역 */
    #recordBoard { display: none; }
    
    .record-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 10px; 
      margin: 16px 0 24px 0; 
    }
    .record-item {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .record-title { font-size: 13px; color: #166534; font-weight: 600; margin-bottom: 4px; }
    .record-score { font-size: 17px; font-weight: 800; color: #15803d; word-break: keep-all; }
    .record-empty { font-size: 14px; font-weight: 600; color: #94a3b8; }

    /* 즉시 갱신 시 시각적 하이라이트 애니메이션 */
    .record-highlight {
      background: #dcfce7 !important;
      border-color: #16a34a !important;
      transform: scale(1.05);
    }

    /* 새 기록 입력 영역 */
    .submit-area {
      background: #fdfae8;
      border: 2px dashed #fde047;
      padding: 20px;
      border-radius: 12px;
    }
    .submit-area h3 { margin: 0 0 12px 0; color: #854d0e; text-align: center; font-size: 16px; }
    
    .event-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .event-btn {
      padding: 10px;
      background: white;
      border: 1px solid #fde047;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-align: center;
      transition: all 0.15s;
    }
    .event-btn.selected {
      background: #eab308;
      color: white;
      font-weight: bold;
      border-color: #ca8a04;
    }

    .score-input-group { display: flex; gap: 8px; }
    .score-input {
      flex: 2;
      padding: 12px;
      border: 1px solid #fde047;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
    }
    .score-input:focus {
      outline: none;
      border-color: #ca8a04;
    }
    .btn-submit {
      flex: 1;
      background: #eab308;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-submit:hover { background: #ca8a04; }
    
    #loadingMsg { text-align: center; color: #166534; font-weight: bold; display: none; margin-top: 10px; }

    /* 백그라운드 동기화 상태 배지 */
    #syncStatus {
      display: none;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: 8px;
    }

    /* 직접 접속 차단용 잠금 화면 */
    #lockScreen {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .lock-input {
      padding: 12px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
      margin-bottom: 12px;
      width: 200px;
    }
  </style>
</head>
<body>

  <!-- 학교 코드 미인증 시 차단 카드 -->
  <div class="card" id="lockScreen">
    <div style="font-size:48px; margin-bottom:12px;">🔒</div>
    <h2>학교 코드 인증이 필요합니다</h2>
    <p style="color:#64748b; font-size:14px; margin-bottom:20px;">우리 학교 학생만 접근 가능한 페이지입니다.</p>
    <input type="password" id="directCodeInput" class="lock-input" placeholder="학교 코드" onkeypress="if(event.key==='Enter') unlockDirectly()"><br>
    <button class="btn-search" style="max-width:200px;" onclick="unlockDirectly()">인증 및 입장</button>
  </div>

  <!-- 실제 기록실 본문 -->
  <div id="mainApp" style="display:none;">
    
    <div class="top-nav">
      <a href="index.html" class="back-btn">← 메인 플랫폼으로 돌아가기</a>
      <button onclick="adminLogin()" class="admin-btn">👨‍🏫 관리자</button>
    </div>

    <div class="card">
      <h1>⏱️ 스포츠스태킹 자율 기록실</h1>
      <p style="text-align:center; color:#15803d; font-size:14px; margin-top:0;">본인의 정보를 입력하고 최고 기록을 조회하세요.</p>
      
      <div class="input-group">
        <input type="number" id="grade" placeholder="학년">
        <input type="number" id="cls" placeholder="반">
        <input type="text" id="name" placeholder="이름 (예:홍길동)">
      </div>
      <button class="btn-search" onclick="searchRecord()">🔍 내 기록 조회하기</button>
      <div id="loadingMsg">기록을 불러오는 중입니다... 🚀</div>
    </div>

    <!-- 조회 완료 시 나타나는 하단 영역 -->
    <div class="card" id="recordBoard">
      <h2 style="font-size: 18px; text-align: center; margin-top: 0; color:#14532d;">🏆 <span id="displayInfo"></span>의 최고 기록</h2>
      
      <!-- 최고 기록 표시 영역 -->
      <div class="record-grid">
        <div class="record-item" id="card-3-3-3"><div class="record-title">3-3-3</div><div class="record-score" id="score-3-3-3">기록 없음</div></div>
        <div class="record-item" id="card-3-6-3"><div class="record-title">3-6-3</div><div class="record-score" id="score-3-6-3">기록 없음</div></div>
        <div class="record-item" id="card-사이클"><div class="record-title">사이클</div><div class="record-score" id="score-사이클">기록 없음</div></div>
        <div class="record-item" id="card-더블"><div class="record-title">더블</div><div class="record-score" id="score-더블">기록 없음</div></div>
        <div class="record-item" id="card-3-6-3릴레이"><div class="record-title">3-6-3릴레이</div><div class="record-score" id="score-3-6-3릴레이">기록 없음</div></div>
        <div class="record-item" id="card-사이클릴레이"><div class="record-title">사이클릴레이</div><div class="record-score" id="score-사이클릴레이">기록 없음</div></div>
      </div>

      <!-- 새 기록 입력 영역 -->
      <div class="submit-area">
        <h3>🔥 최고 기록을 경신했나요? 새로 입력해주세요!</h3>
        <div class="event-selector" id="eventSelector">
          <div class="event-btn selected" onclick="selectEvent('3-3-3', this)">3-3-3</div>
          <div class="event-btn" onclick="selectEvent('3-6-3', this)">3-6-3</div>
          <div class="event-btn" onclick="selectEvent('사이클', this)">사이클</div>
          <div class="event-btn" onclick="selectEvent('더블', this)">더블</div>
          <div class="event-btn" onclick="selectEvent('3-6-3릴레이', this)">3-6-3릴레이</div>
          <div class="event-btn" onclick="selectEvent('사이클릴레이', this)">사이클릴레이</div>
        </div>
        <div class="score-input-group">
          <input type="number" step="0.001" id="newScore" class="score-input" placeholder="0.000 (초)">
          <button class="btn-submit" onclick="submitRecord()">기록 갱신!</button>
        </div>
        <div id="syncStatus">☁️ 구글 시트와 동기화 중...</div>
      </div>
    </div>
  </div>

  <script>
    const CORRECT_CODE = 'pr5811';
    // ★★★ 구글 Apps Script 웹 앱 URL (exec로 끝나는 주소) ★★★
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2ABEw49MhLsZ750gZwc98vOH7lVyFmVyQ8EslfgZjs4a_II4fuAoGjHqsz4CKHGY/exec'; 
    let currentEvent = '3-3-3';

    // 보안 검증
    document.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('school_verified') === 'true') {
        document.getElementById('mainApp').style.display = 'block';
      } else {
        document.getElementById('lockScreen').style.display = 'block';
      }
    });

    function unlockDirectly() {
      const code = document.getElementById('directCodeInput').value.trim();
      if (code === CORRECT_CODE) {
        sessionStorage.setItem('school_verified', 'true');
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
      } else {
        alert('❌ 잘못된 학교 코드입니다. 메인 페이지로 이동합니다.');
        window.location.href = 'index.html';
      }
    }
    
    function adminLogin() {
      const pw = prompt("관리자 비밀번호를 입력하세요.");
      if (pw === 'kimko1234') {
        sessionStorage.setItem('admin_verified', 'true');
        window.location.href = 'admin-dashboard.html';
      } else if (pw !== null) {
        alert("비밀번호가 일치하지 않습니다.");
      }
    }

    function formatScore(scoreValue) {
      if (!scoreValue || scoreValue === '-' || scoreValue === '') {
        return '<span class="record-empty">기록 없음</span>';
      }
      return parseFloat(scoreValue).toFixed(3) + '초';
    }

    function searchRecord() {
      const grade = document.getElementById('grade').value.trim();
      const cls = document.getElementById('cls').value.trim();
      const name = document.getElementById('name').value.trim();

      if(!grade || !cls || !name) { alert('학년, 반, 이름을 모두 입력해주세요!'); return; }

      document.getElementById('loadingMsg').style.display = 'block';
      document.getElementById('recordBoard').style.display = 'none';
      
      const query = `?grade=${encodeURIComponent(grade)}&class=${encodeURIComponent(cls)}&name=${encodeURIComponent(name)}`;
      
      fetch(SCRIPT_URL + query, {
        method: 'GET',
        redirect: 'follow'
      })
      .then(res => {
        if (!res.ok) throw new Error('서버 응답 오류');
        return res.json();
      })
      .then(data => {
        document.getElementById('loadingMsg').style.display = 'none';
        document.getElementById('displayInfo').innerText = `${grade}학년 ${cls}반 ${name}`;
        document.getElementById('recordBoard').style.display = 'block';
        
        if (data && typeof data === 'object') {
          document.getElementById('score-3-3-3').innerHTML = formatScore(data['3-3-3']);
          document.getElementById('score-3-6-3').innerHTML = formatScore(data['3-6-3']);
          document.getElementById('score-사이클').innerHTML = formatScore(data['사이클']);
          document.getElementById('score-더블').innerHTML = formatScore(data['더블']);
          document.getElementById('score-3-6-3릴레이').innerHTML = formatScore(data['3-6-3릴레이']);
          document.getElementById('score-사이클릴레이').innerHTML = formatScore(data['사이클릴레이']);
        } else {
          ['3-3-3', '3-6-3', '사이클', '더블', '3-6-3릴레이', '사이클릴레이'].forEach(ev => {
            document.getElementById(`score-${ev}`).innerHTML = '<span class="record-empty">기록 없음</span>';
          });
          alert('환영합니다! 아직 등록된 기록이 없습니다. 새로운 최고 기록을 달성하고 하단에 등록해보세요.');
        }
      })
      .catch(err => {
        console.error('Fetch Error:', err);
        document.getElementById('loadingMsg').style.display = 'none';
        alert('데이터를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.');
      });
    }

    function selectEvent(eventName, element) {
      currentEvent = eventName;
      document.querySelectorAll('.event-btn').forEach(btn => btn.classList.remove('selected'));
      element.classList.add('selected');
    }

    // ★★★ 낙관적 업데이트(Optimistic Update) 핵심 로직 ★★★
    function submitRecord() {
      const grade = document.getElementById('grade').value.trim();
      const cls = document.getElementById('cls').value.trim();
      const name = document.getElementById('name').value.trim();
      const scoreInput = document.getElementById('newScore');
      const score = scoreInput.value.trim();

      if(!score) { alert('측정된 기록을 입력해주세요!'); return; }

      const numScore = parseFloat(score);
      const scoreElement = document.getElementById(`score-${currentEvent}`);
      const cardElement = document.getElementById(`card-${currentEvent}`);
      const syncStatus = document.getElementById('syncStatus');

      // 1. 기존 화면에 적혀있던 원래 값 보관 (통신 실패 시 롤백용)
      const previousHTML = scoreElement.innerHTML;

      // 2. [0초 반응] 화면의 최고 기록 숫자를 즉시 갱신하고 초록색 강조 효과 적용
      scoreElement.innerHTML = `${numScore.toFixed(3)}초`;
      cardElement.classList.add('record-highlight');
      setTimeout(() => cardElement.classList.remove('record-highlight'), 1000);

      // 입력창 비우기 및 동기화 문구 표시
      scoreInput.value = '';
      syncStatus.style.display = 'block';
      syncStatus.innerText = '☁️ 구글 시트로 안전하게 전송 중...';

      // 3. 백그라운드에서 조용히 구글 시트로 전송
      const payload = { grade: grade, cls: cls, name: name, event: currentEvent, score: score };

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        redirect: 'follow'
      })
      .then(res => res.json())
      .then(res => {
        if(res.status === '승인완료') {
          syncStatus.innerText = '✅ 구글 시트 저장 완료!';
          setTimeout(() => { syncStatus.style.display = 'none'; }, 2000);
        } else {
          // 비정상 수치(1초 미만 등)로 승인 대기 걸린 경우
          syncStatus.style.display = 'none';
          alert('🚨 입력하신 기록이 너무 빨라 [승인 대기] 상태로 접수되었습니다. 선생님 확인 후 최종 반영됩니다.');
        }
      })
      .catch(err => {
        // 4. 통신 실패 시 화면을 이전 기록으로 롤백(되돌리기)
        console.error('Submit Error:', err);
        scoreElement.innerHTML = previousHTML;
        syncStatus.style.display = 'none';
        alert('❌ 인터넷 연결 불안정으로 기록 전송에 실패했습니다. 다시 시도해주세요.');
      });
    }
  </script>
</body>
</html>
